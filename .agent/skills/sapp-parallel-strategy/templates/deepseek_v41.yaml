# DeepSeek-V4.1, the validation crop its launcher trains (text_parameter_divisor 8, 16 routed experts,
# all 40 layers), as examples/training_demo/deepseek_v41/train_deepseek_v41_online.yaml describes a run,
# with ND's context section added. scripts/ask.py fills the fields a request states and leaves the
# parallel degrees to ND. config_path and engram_assets_path are resolved against this folder, which
# ships the released config.json and the crop's Engram assets: ND builds the crop's config through the
# recipe's own factory and measures what the stack keeps with its census, so this template needs a
# checkout with hyper_parallel.models.deepseek_v41. Where that is missing, ask.py prices
# deepseek_v41_description.yaml instead, the crop described by hand.
# The factory keeps the released depth, so a request cannot change the number of layers.
# context.moe_dispatch is 0: ND's default dispatch cost was fitted on Qwen3.5-MoE, whose compute grows 61%
# from EP 1 to EP 16, where this crop's falls 3.3%, so the fitted cost does not carry over.
# The tokenizer and data paths matter only for a launch: set them on the cluster.
model:
  _target_: hyper_parallel.models.deepseek_v41.adapter.validation.cropped_model.build_cropped_deepseek_v41
  config_path: deepseek_v41
  engram_assets_path: deepseek_v41/engram_depth_preserving_d8.json
  text_parameter_divisor: 8
  num_routed_experts: 16
  exercise_post_training_indexer: true
  indexer_loss_coeff: 0.001
  torch_dtype: bfloat16
  validate_placement: false
model_init_dtype: float32
training:
  train_iters: 1
  train_samples: null
  eval_iters: 0
  global_batch_size: 16
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true
accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 16
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false
fsdp_config:
  dp_shard_size: 16
  edp_shard_size: 1
  replicate_params: []
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: float32
    cast_forward_inputs: false
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false
plan_overrides:
- match:
  - model.layers.*.attn_hc
  - model.layers.*.ffn_hc
  module_type: hyper_parallel.models.deepseek_v41.modeling_deepseek_v41.DeepseekV41PipelinedHyperConnection
  replace_module:
    _target_: hyper_parallel.components.modules.mhc.PipelinedMhcModule
- match: model.layers.*.engram
  module_type: hyper_parallel.models.deepseek_v41.modeling_deepseek_v41.DeepseekV41Engram
  replace_module:
    _target_: hyper_parallel.components.modules.engram.EngramModule
- match: model.layers.*.self_attn
  module_type: hyper_parallel.models.deepseek_v41.modeling_deepseek_v41.DeepseekV41Attention
  replace_module:
    _target_: hyper_parallel.components.modules.shared_compressed_dsa_attention.SharedCompressedDSAAttention
- match: '*.self_attn'
  tp_divide_attrs:
  - num_groups
- match: '*.self_attn'
  region_dispatch: false
  inner_target: self
  inner_wrapper:
    _target_: hyper_parallel.models.deepseek_v41.adapter.distributed.shared_attention_context_parallel.deepseek_v41_shared_attention_parallel_wrapper
- match: model.layers.*.*_hc
  region_dispatch: false
  params:
    fn:
      tp: replicate
    base:
      tp: replicate
    scale:
      tp: replicate
  in_src:
    hidden_streams:
      tp: replicate
      cp: shard(1)
      ep: replicate
  in_dst:
    hidden_streams:
      tp: replicate
      cp: shard(1)
      ep: replicate
  out_src:
    pre:
      tp: replicate
      cp: shard(1)
      ep: replicate
    post:
      tp: replicate
      cp: shard(1)
      ep: replicate
    residual:
      tp: replicate
      cp: shard(1)
      ep: replicate
  out_dst:
    pre:
      tp: replicate
      cp: shard(1)
      ep: replicate
    post:
      tp: replicate
      cp: shard(1)
      ep: replicate
    residual:
      tp: replicate
      cp: shard(1)
      ep: replicate
- match: model.layers.*.*_hc
  when: sequence_parallel
  in_src:
    hidden_streams:
      tp: shard(1)
      cp: shard(1)
      ep: replicate
  in_dst:
    hidden_streams:
      tp: shard(1)
      cp: shard(1)
      ep: replicate
  out_src:
    pre:
      tp: shard(1)
      cp: shard(1)
      ep: replicate
    post:
      tp: shard(1)
      cp: shard(1)
      ep: replicate
    residual:
      tp: shard(1)
      cp: shard(1)
      ep: replicate
  out_dst:
    pre:
      tp: shard(1)
      cp: shard(1)
      ep: replicate
    post:
      tp: shard(1)
      cp: shard(1)
      ep: replicate
    residual:
      tp: shard(1)
      cp: shard(1)
      ep: replicate
- match: model.layers.*.engram
  params:
    q_weight:
      tp: replicate
    k_weight:
      tp: replicate
    embed.weight:
      ep: shard(0)
    wkv.weight:
      tp: replicate
- match: model.layers.*.engram
  when: ep
  region_dispatch: false
  local_compute_fn:
    _target_: hyper_parallel.models.deepseek_v41.adapter.distributed.moe_engram_expert_parallel.deepseek_v41_engram_compute_fn
- match: '*.mlp'
  when: ep
  region_dispatch: false
  local_compute_fn:
    _target_: hyper_parallel.models.deepseek_v41.adapter.distributed.moe_engram_expert_parallel.deepseek_v41_ep_compute_fn
    use_grouped_gemm: false
mixed_precision:
  enabled: false
activation_checkpoint:
  mode: 'off'
  selection:
    source: model_adapter_safe_regions
    layer_count: 0
activation_swap: none
compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256
dataset:
  model_assets:
    chat_template: null
    tokenizer:
      _target_: hyper_parallel.data.text.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: /path/to/DeepSeek-V4.1-Flash
      local_files_only: true
      use_fast: true
      trust_remote_code: false
  data_transform:
    _target_: hyper_parallel.data.text.text_transform.build_text_transform
    data_type: plaintext
    text_keys: text
    max_seq_len: 4096
  _target_: hyper_parallel.data.text.build_dataset.build_online_text_mapping_dataset
  data_path: ./output/training_demo/deepseek_v41/online_4k.jsonl
  data_config:
    create_attention_mask_in_dataloader: true
    labels_are_shifted: true
dataloader:
  _target_: hyper_parallel.data.batching.TokenBatchLoader
  min_buffered_samples: 1
  collate_fn:
    _target_: hyper_parallel.data.batching.build_online_text_collate_fn
  get_batch:
    _target_: hyper_parallel.data.batching.TextParallelBatch
    source_type: online
    attention_mode: compressed
    runtime_input_adapter:
      _target_: hyper_parallel.models.deepseek_v41.adapter.data.runtime.DeepseekV41Runtime
      include_position_ids: false
      include_image_sequence_start: false
  sampler_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null
optimizer:
  _target_: hyper_parallel.components.optim.Muon
  fp32_main_params: true
  no_decay_params:
  - bias
  - norm
  - ln_
  muon_config:
    muon_lr: 3.0e-05
    muon_weight_decay: 0.0
    muon_momentum: 0.95
    muon_nesterov: true
    muon_ns_steps: 5
    muon_ns_variant: asym5
  adamw_config:
    adamw_lr: 1.0e-05
    adamw_weight_decay: 0.01
    adamw_betas:
    - 0.9
    - 0.999
    adamw_eps: 1.0e-08
lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 3.0e-05
    lr_warmup_steps: 1
    min_lr: 0.0
checkpoint:
  save_ckpt: false
  checkpoint_dir: ./output/training_demo/deepseek_v41/checkpoints
  restore_from: null
debug:
  check_nan_inf: false
  check_dataset: null
context:
  device_num: 16
  expert_shard: group
  census: true
  moe_dispatch: 0
