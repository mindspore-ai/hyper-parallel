name: Codegen PR gate

on:
  pull_request:
    paths:
      - '.github/workflows/codegen-gate.yml'
      - 'hyper_parallel/**'
      - 'scripts/check_codegen_bundle_parity.py'
      - 'scripts/train*.py'
      - 'tests/ut/codegen/**'
      - 'tests/ut/models/**'
      - 'tests/common/**'
      - 'requirements.txt'
      - 'setup.py'

permissions:
  contents: read

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest matplotlib timm
          python -m pip install -e .
      - name: Check native isolation, re-entry and bundle parity
        run: |
          python -m pytest -q tests/ut/codegen tests/ut/models/test_preparation_manifest.py
