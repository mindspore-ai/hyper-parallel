name: CLA label sync tests

on:
  pull_request:
    paths:
      - .github/scripts/cla-label-sync*.mjs
      - .github/scripts/reviewer-approval-gate.mjs
      - .github/workflows/cla-label-sync*.yml
  push:
    branches: [master]
    paths:
      - .github/scripts/cla-label-sync*.mjs
      - .github/scripts/reviewer-approval-gate.mjs
      - .github/workflows/cla-label-sync*.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node --test .github/scripts/cla-label-sync.test.mjs
