name: Package installation check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: package-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-install-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -el {0}
    env:
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          miniforge-version: latest
          activate-environment: py312
          python-version: '3.12'
          auto-activate-base: false

      - name: Build the Linux wheel with the indexed dataset extension
        run: |
          python -m pip install setuptools wheel pybind11 twine
          bash build.sh --multicore off --strict on --jobs 2
          wheels=(build/native/wheel-output/*.whl)
          test "${#wheels[@]}" -eq 1
          test -f "${wheels[0]}"
          python -m twine check --strict "${wheels[0]}"
          echo "PACKAGE_WHEEL=$GITHUB_WORKSPACE/${wheels[0]}" >> "$GITHUB_ENV"
          echo "INSTALL_PREFIX=$RUNNER_TEMP/package-install-envs/py312" >> "$GITHUB_ENV"

      - name: Install the wheel and its declared dependencies in a clean environment
        run: |
          conda create --yes --prefix "$INSTALL_PREFIX" python=3.12 pip
          printf 'torch==2.9.1\n' > "$RUNNER_TEMP/package-install-constraints.txt"
          conda run --no-capture-output --prefix "$INSTALL_PREFIX" python -m pip install \
            'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
          conda run --no-capture-output --prefix "$INSTALL_PREFIX" python -m pip install \
            --constraint "$RUNNER_TEMP/package-install-constraints.txt" "$PACKAGE_WHEEL"
          conda run --no-capture-output --prefix "$INSTALL_PREFIX" python -m pip check

      - name: Validate the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          conda run --no-capture-output --prefix "$INSTALL_PREFIX" python -I \
            "$GITHUB_WORKSPACE/.github/scripts/validate_installed_package.py" \
            --wheel "$PACKAGE_WHEEL" --source-root "$GITHUB_WORKSPACE"
