name: Reviewer approval gate

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - edited
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed
      - closed
  workflow_run:
    workflows: [Reviewer approval signal]
    types: [completed]
  push:
    branches: [master]
    paths:
      - .github/reviewer-approval-policy.json
      - .github/scripts/ci-label-expiry.mjs
      - .github/scripts/reviewer-approval-gate.mjs
      - .github/workflows/reviewer-approval-gate.yml
      - .github/workflows/reviewer-approval-signal.yml
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

# Reconcile current API state, so coalescing pending events does not replay an
# obsolete approval. A running writer must finish before the next one starts.
concurrency:
  group: reviewer-approval-gate
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'mindspore-ai/hyper-parallel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate required reviewer approvals
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/reviewer-approval-gate.mjs --write
