name: Expire CI pass labels

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_run:
    workflows: [Label Gate Check]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  # Sweeps and completion events can update the same head and merge commit.
  group: expire-ci-pass-labels
  cancel-in-progress: false

jobs:
  expire:
    if: github.repository == 'mindspore-ai/hyper-parallel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only trusted default-branch code receives the write token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile CI validity status and remove expired labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/ci-label-expiry.mjs --write
