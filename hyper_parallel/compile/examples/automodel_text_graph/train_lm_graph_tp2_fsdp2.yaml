# Graph standard-regression YAML:
# - Qwen3-0.6B structure + local indexed (pretokenized) dataset
# - TP2 + FSDP2 four-card setup
# - used to verify the standard scripts/train_lm.py graph entry
# - no absolute model path in this file; inject it at runtime, e.g.
#   --model.pretrained_model_name_or_path=/path/to/Qwen3-0.6B

model:
  _target_: hyper_parallel.models.HyperAutoModelForCausalLM.from_pretrained
  torch_dtype: bfloat16
  attn_implementation: sdpa
  force_hf: true

optimizer:
  _target_: hyper_parallel.components.optim.builders.AdamW
  adamw_config:
    lr: 1.0e-4
    adamw_weight_decay: 0.0

lr_scheduler:
  _target_: hyper_parallel.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: constant
  lr_config:
    lr: 1.0e-4
    lr_warmup_steps: 0

training:
  train_iters: 10
  global_batch_size: 4
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  logging_steps: 1
  seed: 42
  enable_full_determinism: false

accelerator:
  tp_size: 2
  cp_size: 1
  ep_size: 1
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 2

compile:
  enabled: true
  use_joint_graph: true

dataset:
  _target_: hyper_parallel.data.text.build_dataset.build_indexed_text_dataset
  # Pretokenized .bin/.idx prefix; override with --dataset.data_path=<prefix>
  data_path: ./output/automodel_text_graph/indexed_text_document
  model_assets:
    chat_template: null
    tokenizer:
      # Metadata-only tokenizer; inherits the model pretrained_model_name_or_path.
      _target_: hyper_parallel.data.text.build_tokenizer.AutoTokenizer.from_pretrained
      tokenizer_type: pretokenized
      vocab_size: 151936
      eod_token_id: 151645
  data_config:
    seq_length: 128
    split: "1, 0, 0"
    mock_data: false
    distributed_walk: true
    is_dataset_from_mr: false
    simple_blend: "no"
    data_lazy_load: true
    skip_data_check: true
    # Indexed Dataset already returns text[1:] as the target.
    labels_are_shifted: true
    # The implicit-mask path relies on the model's own causal mask.
    create_attention_mask_in_dataloader: false
    create_ltor_fields_in_dataloader: false

dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  dataloader_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null
  collate_fn:
    _target_: hyper_parallel.data.batching.build_indexed_collate_fn
  get_batch:
    _target_: hyper_parallel.data.batching.ParallelBatch
    source_type: indexed
    attention_mode: dense

checkpoint:
  save_ckpt: false
