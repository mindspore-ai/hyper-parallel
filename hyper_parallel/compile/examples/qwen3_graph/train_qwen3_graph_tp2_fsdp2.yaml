# Qwen3-0.6B with fixed-length WikiText batches on four Ascend NPUs.
model_init_dtype: bfloat16

model:
  _target_: hyper_parallel.models.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: ./output/models/Qwen3-0.6B
  load_base_model: false
  torch_dtype: bfloat16
  attn_implementation: sdpa
  force_hf: true
  config_overrides:
    # Give the LM head its own TP parameter and communication boundary.
    tie_word_embeddings: false

optimizer:
  _target_: hyper_parallel.components.optim.builders.AdamW
  adamw_config:
    lr: 1.0e-4
    adamw_weight_decay: 0.0

lr_scheduler:
  _target_: hyper_parallel.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: constant
  lr_config:
    lr: 1.0e-4
    lr_warmup_steps: 0

training:
  train_iters: 10
  global_batch_size: 4
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  logging_steps: 1
  seed: 42
  enable_full_determinism: false

accelerator:
  tp_size: 2
  cp_size: 1
  ep_size: 1
  pp_size: 1
  sequence_parallel: true
  loss_parallel: false

fsdp_config:
  dp_shard_size: 2

activation_checkpoint:
  mode: full

compile:
  enabled: true
  use_joint_graph: true
  fsdp_allgather_prefetch: true
  fsdp_overlap_grad_reduce: true  # Advance backward reduce-scatter and delay its wait
  max_in_flight_gb: 0.25  # 256 MiB of prefetched full parameters before first use

dataset:
  _target_: hyper_parallel.data.text.build_dataset.build_indexed_text_dataset
  # Pretokenized .bin/.idx prefix; override with --dataset.data_path=<prefix>
  data_path: ./output/dataset/wikitext_text_document
  model_assets:
    chat_template: null
    tokenizer:
      # Metadata-only tokenizer; inherits the model pretrained_model_name_or_path.
      _target_: hyper_parallel.data.text.build_tokenizer.AutoTokenizer.from_pretrained
      tokenizer_type: pretokenized
      vocab_size: 151936
      eod_token_id: 151645
  data_config:
    seq_length: 128
    low_level_dataset:
      _target_: hyper_parallel.data.indexed.indexed_pretrain_dataset.GPTDataset
    split: "1, 0, 0"
    mock_data: false
    distributed_walk: true
    is_dataset_from_mr: false
    simple_blend: "no"
    data_lazy_load: true
    skip_data_check: true
    # Indexed Dataset already returns text[1:] as the target.
    labels_are_shifted: true
    # Build the full mask before embedding sequence-parallel sharding.
    create_attention_mask_in_dataloader: true
    create_ltor_fields_in_dataloader: false

dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  sampler_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null
  collate_fn:
    _target_: hyper_parallel.data.batching.build_indexed_collate_fn
  get_batch:
    _target_: hyper_parallel.data.batching.TextParallelBatch
    source_type: indexed
    attention_mode: dense

checkpoint:
  save_ckpt: false
