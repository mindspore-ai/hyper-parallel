<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
<title id="title">HyperParallel-RL：三层架构与同步训练闭环</title>
<desc id="desc">用户通过 Python 扩展任务、交互、工具、奖励与算法。HyperParallel-RL 核心由 SyncTrainer 显式编排采样、统一轨迹、学习与策略发布。vLLM 承载推理采样，HyperParallel 承载模型训练与并行。原始 token 保真，更新前可选 Bit-Exact 校验，策略发布完成后恢复采样。</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536b89"/></marker>
<marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3577c5"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#20354e}
.heading{font-size:28px;font-weight:700}.layer{font-size:17px;font-weight:700}.title{font-size:20px;font-weight:650}.body{font-size:16px}.small{font-size:14px;fill:#59708a}
.flow{fill:none;stroke:#536b89;stroke-width:2;marker-end:url(#arrow)}
.extension{fill:none;stroke:#9a80b6;stroke-width:2;stroke-dasharray:5 5}
.support{fill:none;stroke:#a4b3c4;stroke-width:2}
</style>
</defs>
<rect width="1200" height="810" rx="20" fill="#f8fafc"/>
<text x="36" y="46" class="heading">HyperParallel-RL</text>
<text x="1164" y="43" text-anchor="end" class="body">当前同步架构</text>

<rect x="32" y="72" width="1136" height="134" rx="16" fill="#f4f0f9" stroke="#e4daee"/>
<text x="54" y="101" class="layer" style="fill:#75528f">用户扩展 · Python</text>
<rect x="54" y="116" width="442" height="68" rx="10" fill="white"/>
<text x="74" y="143" class="title">任务与交互</text>
<text x="74" y="167" class="body">Environment / AgentProgram</text>
<rect x="516" y="116" width="286" height="68" rx="10" fill="white"/>
<text x="536" y="143" class="title">工具与奖励</text>
<text x="536" y="167" class="body">Tools / Reward</text>
<rect x="822" y="116" width="324" height="68" rx="10" fill="white"/>
<text x="842" y="143" class="title">算法</text>
<text x="842" y="167" class="body">Advantage / Policy loss</text>
<path d="M275 206V240M659 206V240M984 206V240" class="extension"/>

<rect x="32" y="240" width="1136" height="330" rx="16" fill="white" stroke="#cbd8e7"/>
<text x="54" y="270" class="layer">HyperParallel-RL 核心</text>
<rect x="54" y="285" width="1092" height="51" rx="10" fill="#20354e"/>
<text x="76" y="317" class="title" style="fill:white">SyncTrainer · 显式编排</text>
<text x="1124" y="316" text-anchor="end" class="body" style="fill:#d7e5f4">YAML / CLI 入口 · 评估与恢复 · 同步无需 Ray</text>

<rect x="54" y="365" width="232" height="129" rx="12" fill="#eef7f4" stroke="#b8d8ce"/>
<text x="74" y="396" class="title">采样与交互</text>
<text x="74" y="425" class="body">任务调用生成服务</text>
<text x="74" y="450" class="body">动作 ↔ 工具 / 环境</text>
<text x="74" y="477" class="small">使用已发布策略 V</text>

<rect x="322" y="365" width="258" height="129" rx="12" fill="#f5f2fa" stroke="#d9cde7"/>
<text x="342" y="396" class="title">统一轨迹与训练样本</text>
<text x="342" y="425" class="body">Trajectory → ExperienceBatch</text>
<text x="342" y="450" class="body">tokens · logprobs · mask</text>
<text x="342" y="477" class="small">原始 token 保真 · 策略可追溯</text>

<rect x="616" y="365" width="248" height="129" rx="12" fill="#edf4fc" stroke="#bfd3eb"/>
<text x="636" y="396" class="title">学习与更新</text>
<text x="636" y="425" class="body">Advantage / Loss</text>
<text x="636" y="450" class="body">Actor 更新 → 策略 V+1</text>
<text x="636" y="477" class="small">更新前可选 Bit-Exact 校验</text>

<rect x="900" y="365" width="246" height="129" rx="12" fill="#edf4fc" stroke="#bfd3eb"/>
<text x="920" y="396" class="title">策略发布</text>
<text x="920" y="425" class="body">权重同步与身份校验</text>
<text x="920" y="450" class="body">NPU IPC / HCCL</text>
<text x="920" y="477" class="small">完成发布后恢复采样</text>
<path d="M286 429H314" class="flow"/>
<path d="M580 429H608" class="flow"/>
<path d="M864 429H892" class="flow"/>
<path d="M1023 494V538H170V501" fill="none" stroke="#3577c5" stroke-width="2.5" marker-end="url(#blue)"/>
<rect x="430" y="521" width="348" height="30" rx="15" fill="white"/>
<text x="604" y="542" text-anchor="middle" class="body" style="fill:#3577c5">发布 V+1 → 下一轮采样</text>

<path d="M170 570V616M740 570V592H858V616" class="support"/>
<rect x="32" y="616" width="1136" height="141" rx="16" fill="#f0f4f8" stroke="#dce4ed"/>
<text x="54" y="646" class="layer">基础设施 · 复用模型与执行能力</text>
<rect x="54" y="662" width="530" height="73" rx="10" fill="white"/>
<text x="74" y="692" class="title" style="fill:#248470">vLLM / vLLM-Ascend</text>
<text x="74" y="718" class="body">推理采样 · 请求调度 · KV cache</text>
<rect x="604" y="662" width="542" height="73" rx="10" fill="white"/>
<text x="624" y="692" class="title" style="fill:#3577c5">HyperParallel</text>
<text x="624" y="718" class="body">模型训练 · FSDP / TP / EP · 优化器</text>
<text x="36" y="787" class="small">箭头：训练闭环；虚线：用户扩展。模型与部署范围、Bit-Exact 适用条件见 README。</text>
</svg>
