<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
  <title id="title">Hyper-RL：极简易用、易于扩展、Agentic 原生</title>
  <desc id="desc">SyncTrainer 统一编排同步训练。任务层支持单轮任务、多轮环境与程序化 Agent，并提供工具、奖励和算法扩展入口。任务调用 vLLM 采样，原始 token、动作掩码和策略身份形成统一轨迹，进入 HyperParallel 支持的学习与更新。下一策略完成权重传输、身份校验和缓存重置后恢复采样。Bit-Exact 为更新前的可选检查。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
    <style>
      text { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill:#172b45; }
      .heading { font-size:26px; font-weight:700; }
      .title { font-size:21px; font-weight:700; }
      .body { font-size:16px; }
      .small { font-size:14px; fill:#526580; }
      .label { font-size:13px; fill:#526580; }
      .flow { fill:none; stroke:#64748b; stroke-width:2; marker-end:url(#arrow); }
      .policy { fill:none; stroke:#2563eb; stroke-width:2.5; marker-end:url(#blue); }
      .extension { fill:none; stroke:#9471bd; stroke-width:2; stroke-dasharray:5 5; }
    </style>
  </defs>
  <rect width="1280" height="840" rx="20" fill="#f8fafc"/>
  <text x="40" y="44" class="heading">Hyper-RL</text>
  <text x="1240" y="42" text-anchor="end" class="small">当前同步架构 · 任务扩展与训练主流程</text>

  <rect x="40" y="66" width="384" height="72" rx="12" fill="#edf5ff"/>
  <text x="60" y="94" class="title" style="fill:#1d4ed8">01 极简易用</text>
  <text x="60" y="121" class="body">一个入口 · 显式编排 · 复用基础能力</text>
  <rect x="448" y="66" width="384" height="72" rx="12" fill="#e9f7f3"/>
  <text x="468" y="94" class="title" style="fill:#087f68">02 易于扩展</text>
  <text x="468" y="121" class="body">任务与工具 · 奖励与算法 · 清晰边界</text>
  <rect x="856" y="66" width="384" height="72" rx="12" fill="#f2edff"/>
  <text x="876" y="94" class="title" style="fill:#7040b8">03 Agentic 原生</text>
  <text x="876" y="121" class="body">单轮 / 多轮 · 环境交互 · 统一轨迹</text>

  <rect x="40" y="160" width="1200" height="68" rx="12" fill="#172b45"/>
  <text x="62" y="189" class="body" style="fill:white;font-weight:700">train_rl.py + YAML / CLI → SyncTrainer</text>
  <text x="62" y="214" class="small" style="fill:#c8d8ed">Hyper-RL：编排采样、学习、策略发布、评估与恢复</text>
  <text x="1218" y="189" text-anchor="end" class="body" style="fill:white">Colocated / disjoint 共用主循环</text>
  <text x="1218" y="214" text-anchor="end" class="small" style="fill:#c8d8ed">发布成功后提交训练步，再执行评估与 checkpoint</text>

  <text x="40" y="258" class="small">扩展入口（虚线连接到对应职责）</text>
  <rect x="40" y="272" width="760" height="64" rx="10" fill="#f5f1fc" stroke="#c4b2e5"/>
  <text x="60" y="298" class="body" style="font-weight:700;fill:#7040b8">Environment / AgentProgram · Tools / Reward</text>
  <text x="60" y="322" class="small">定制任务、交互与评分；内置 Harness 已接入</text>
  <rect x="890" y="272" width="350" height="64" rx="10" fill="#f5f1fc" stroke="#c4b2e5"/>
  <text x="910" y="298" class="body" style="font-weight:700;fill:#7040b8">Algorithm · Advantage / Loss</text>
  <text x="910" y="322" class="small">声明数据需求与学习目标</text>
  <path d="M210 336V364M1065 336V364" class="extension"/>

  <rect x="40" y="365" width="340" height="180" rx="14" fill="white" stroke="#c4b2e5"/>
  <text x="60" y="397" class="title" style="fill:#7040b8">任务与交互</text>
  <text x="60" y="426" class="body">单轮任务 / 多轮环境 / Agent 扩展</text>
  <text x="60" y="455" class="body">模型动作 → 工具 / 环境 → 观察</text>
  <text x="60" y="487" class="small">任务评分 → reward；完成后输出轨迹</text>
  <text x="60" y="516" class="small">策略动作参与学习，环境观察不计入 loss</text>

  <rect x="470" y="387" width="330" height="136" rx="14" fill="#f2edff" stroke="#c4b2e5"/>
  <text x="490" y="419" class="title" style="font-size:19px">Trajectory → ExperienceBatch</text>
  <text x="490" y="451" class="body">原始 tokens / logprobs / action mask</text>
  <text x="490" y="480" class="body">reward / 策略身份 V</text>
  <text x="490" y="506" class="small">Hyper-RL：统一样本与数据合同</text>
  <path d="M380 448H462" class="flow"/>
  <path d="M800 448H882" class="flow"/>
  <text x="425" y="435" text-anchor="middle" class="label">轨迹</text>
  <text x="845" y="435" text-anchor="middle" class="label">训练样本</text>

  <rect x="890" y="365" width="350" height="245" rx="14" fill="white" stroke="#a5bfee"/>
  <text x="910" y="397" class="title" style="fill:#1d4ed8">学习与更新</text>
  <text x="910" y="427" class="small">Hyper-RL：Reference / Advantage / Loss</text>
  <text x="910" y="458" class="body">reward + 角色输出 → 学习目标</text>
  <text x="910" y="489" class="body">Actor 前反向 → optimizer 更新</text>
  <text x="910" y="520" class="small">更新前可选检查：Bit-Exact logprobs</text>
  <path d="M910 536H1220" stroke="#dbe6f5"/>
  <text x="910" y="563" class="body" style="font-weight:700;fill:#1d4ed8">HyperParallel / HyperAutoModel</text>
  <text x="910" y="589" class="small">模型 · FSDP / TP / EP · optimizer</text>

  <rect x="40" y="600" width="340" height="110" rx="14" fill="#e9f7f3" stroke="#9ccfbd"/>
  <text x="60" y="632" class="title" style="fill:#087f68">vLLM 采样服务</text>
  <text x="60" y="660" class="body">推理执行 · DP / TP / 静态 EP</text>
  <text x="60" y="688" class="small">使用已发布策略 V，返回 tokens 与 logprobs</text>
  <path d="M110 545V592" class="flow"/>
  <path d="M300 600V553" class="flow"/>
  <text x="122" y="577" class="label">生成请求</text>
  <text x="288" y="577" text-anchor="end" class="label">模型动作</text>

  <text x="470" y="576" class="small">基础设施职责</text>
  <text x="470" y="607" class="body">vLLM 负责采样，HyperParallel 负责训练</text>
  <text x="470" y="635" class="small">Hyper-RL 连接任务、样本、学习与策略发布</text>
  <text x="470" y="668" class="small">同步模式直接编排，不依赖 Ray</text>

  <path d="M1065 610V650" class="flow"/>
  <text x="1080" y="638" class="label">新权重 V+1</text>
  <rect x="890" y="658" width="350" height="86" rx="12" fill="#edf5ff" stroke="#a5bfee"/>
  <text x="910" y="687" class="title" style="fill:#1d4ed8">策略发布</text>
  <text x="910" y="712" class="small">权重传输 → 身份校验 → 缓存重置</text>
  <text x="910" y="733" class="small">完成后恢复采样；失败时保持不可生成</text>
  <path d="M1065 744V772H210V718" class="policy"/>
  <text x="500" y="758" class="small" style="fill:#1d4ed8">提交 V+1 → 后续采样使用新策略</text>
  <text x="40" y="817" class="label">当前支持范围以 README 为准；Bit-Exact 仅适用于已验证的 Qwen3 dense + Hyper-vLLM matched TP 组合。</text>
</svg>
