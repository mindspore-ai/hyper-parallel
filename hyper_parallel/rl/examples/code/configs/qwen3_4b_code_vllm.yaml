model:
  registry_name: qwen3_4b
  name: qwen3
  weights_path: /models/Qwen3-4B
  tokenizer_path: /models/Qwen3-4B
  config_overrides: null

consistency:
  enabled: false

data:
  train_path: /data/code-stdio/train.parquet
  test_path: /data/code-stdio/validation.parquet
  row_adapter: examples.code.prepare_data:adapt_row
  max_prompt_length: 2048
  max_train_samples: null
  shuffle: true
  num_workers: 0
  prefetch_factor: null
  pin_memory: true

rollout:
  engine: vllm
  num_return_sequences: 4
  max_new_tokens: 1024
  ignore_eos: false
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  seed: 20260814
  vllm:
    deployment: colocated
    data_parallel_size: 2
    port: 8100
    model_implementation: native
    tensor_parallel_size: 2
    weight_sync:
      strategy: full_gather
      bucket_size_mb: 128
    dtype: bfloat16
    trust_remote_code: false
    enforce_eager: true
    enable_prefix_caching: true
    enable_chunked_prefill: true
    gpu_memory_utilization: 0.35
    kv_cache_memory_bytes: 2147483648
    max_model_len: 3072
    block_size: 128
    max_num_seqs: null
    max_num_batched_tokens: 2048
    logprobs_mode: raw_logprobs
    startup_timeout: 600
    request_timeout: 600

agentic:
  module_path: examples.code.agent
  environment: code_stdio
  interaction_mode: single_turn
  max_turns: 1
  max_observation_tokens: 0
  code:
    endpoint: http://127.0.0.1:18790
    runtime_version: sha256:1ac76247ee612e1ac4a07ae10192056f061d93438f7c16578c7b169938b24131
    run_timeout: 5
    request_timeout: 300

evaluation:
  enabled: true
  batch_size: 2
  max_samples: 4
  max_new_tokens: 1024
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  do_sample: false
  log_samples: 4
  progress_steps: 4

algorithm:
  name: grpo
  advantage_epsilon: 1.0e-6
  clip_ratio_low: 0.2
  clip_ratio_high: 0.2
  clip_ratio_c: 3.0
  kl_coef: 0.001
  kl_type: low_var_kl
  loss_aggregation: token-mean

train:
  max_steps: 2
  seed: 1234
  prompt_batch_size: 1
  micro_batch_size: 1
  response_mini_batch_size: 1
  policy_update_epochs: 1
  init_device: meta
  comm_backend: hccl
  learning_gate:
    enabled: false
    min_gradient_norm: 0.0
    require_mixed_rewards: false
  accelerator:
    dp_replicate: 1
    dp_shard: 2
    tp: 2
    cp: 1
    pp: 1
    reshard_after_forward: true
    comm_fusion: false
    activation_checkpoint: full
    cpu_offload: true
  mixed_precision:
    enabled: true
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: null
  optimizer:
    lr: 1.0e-6
    lr_min: 0.0
    lr_decay_style: constant
    lr_warmup_ratio: 0.0
    weight_decay: 0.0
    max_grad_norm: 1.0
    eps: 1.0e-8
    betas: [0.9, 0.999]
    foreach: null
  checkpoint:
    output_dir: /results/qwen3_4b_code_vllm/checkpoints
    save_steps: 0
    save_final: true
    verify_reload: false

logging:
  backends: [console]
  project_name: hyper-rl
  experiment_name: qwen3_4b_code_vllm
  log_steps: 1
  log_samples: 2
  wandb:
    mode: offline
    entity: null
    directory: /results/qwen3_4b_code_vllm/wandb
