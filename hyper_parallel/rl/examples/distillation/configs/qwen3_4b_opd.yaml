model:
  registry_name: qwen3_4b
  name: qwen3
  weights_path: /models/Qwen3-4B
  tokenizer_path: /models/Qwen3-4B
  config_overrides: null

consistency:
  enabled: true

data:
  chat_template_kwargs:
    enable_thinking: false
  train_path: /data/gsm8k/train.parquet
  test_path: /data/gsm8k/test.parquet
  prompt_column: prompt
  answer_column: extra_info
  prompt_instruction: 'Let''s think step by step and output the final answer after "####".'
  max_prompt_length: 512
  max_train_samples: 4
  shuffle: true
  num_workers: 0
  prefetch_factor: null
  pin_memory: true

rollout:
  engine: vllm
  num_return_sequences: 1
  max_new_tokens: 64
  ignore_eos: false
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  seed: 20260814
  vllm:
    deployment: disjoint
    visible_devices: '1'
    data_parallel_size: 1
    port: 8460
    model_implementation: hyper
    tensor_parallel_size: 1
    weight_sync:
      strategy: full_gather
      bucket_size_mb: 128
    dtype: bfloat16
    trust_remote_code: false
    enforce_eager: true
    batch_invariant: true
    enable_prefix_caching: true
    enable_chunked_prefill: true
    gpu_memory_utilization: 0.35
    kv_cache_memory_bytes: 2147483648
    max_model_len: 1024
    block_size: 128
    max_num_seqs: 4
    max_num_batched_tokens: 2048
    logprobs_mode: raw_logprobs
    startup_timeout: 600
    request_timeout: 600

agentic:
  module_path: examples.gsm8k.agent
  environment: gsm8k_tools
  interaction_mode: single_turn
  max_turns: 1
  max_observation_tokens: 0

evaluation:
  enabled: false
  batch_size: 2
  max_samples: 128
  max_new_tokens: 300
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  do_sample: false
  log_samples: 4
  progress_steps: 4

algorithm:
  name: grpo
  advantage_epsilon: 1.0e-6
  clip_ratio_low: 0.2
  clip_ratio_high: 0.2
  clip_ratio_c: 3.0
  kl_coef: 0.001
  kl_type: low_var_kl
  loss_aggregation: token-mean

train:
  max_steps: 2
  seed: 1234
  prompt_batch_size: 1
  micro_batch_size: 1
  response_mini_batch_size: 1
  policy_update_epochs: 1
  init_device: meta
  comm_backend: hccl
  learning_gate:
    enabled: false
    min_gradient_norm: 0.0
    require_mixed_rewards: false
  accelerator:
    dp_replicate: 1
    dp_shard: 1
    tp: 1
    cp: 1
    pp: 1
    reshard_after_forward: true
    comm_fusion: true
    cpu_offload: true
  mixed_precision:
    enabled: true
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: null
  optimizer:
    fp32_main_params: true
    lr: 1.0e-6
    lr_min: 0.0
    lr_decay_style: constant
    lr_warmup_ratio: 0.0
    weight_decay: 0.0
    max_grad_norm: 1.0
    eps: 1.0e-8
    betas: [0.9, 0.999]
    foreach: null
  checkpoint:
    output_dir: /results/qwen3_4b_opd/checkpoints
    save_steps: 250
    save_final: true
    verify_reload: true

logging:
  backends: [console, wandb]
  project_name: hyper-rl
  experiment_name: qwen3_4b_opd
  log_steps: 1
  log_samples: 2
  wandb:
    mode: online
    entity: null
    directory: /results/qwen3_4b_opd/wandb

distillation:
  enabled: true
  teacher_key: teacher_key
  timeout_seconds: 120
  probability_gate:
    max_mean_logprob_diff: 0.1
    max_logprob_diff: 1.0
    max_ratio_outside_fraction: 0.05
  teachers:
    general:
      model_path: /models/Qwen3-30B-A3B
      tokenizer_path: /models/Qwen3-30B-A3B
      served_model_name: opd-teacher
      endpoint: http://127.0.0.1:8450
      max_model_len: 2048
  loss:
    mode: k1
    use_policy_gradient: true
    use_task_rewards: false
    coefficient: 1.0
    clip_ratio: 0.2
    dual_clip: 3.0
    loss_max_clamp: null
