# Ordinary attention o_proj only; expert arithmetic is unchanged and ETP is not enabled.
# Shared HP MoE with fixed-capacity EP transport; identical recipe on Actor and rollout.
model:
  registry_name: qwen3_moe_4l
  name: qwen3_moe
  weights_path: /results/Qwen3-MoE-4L
  tokenizer_path: /results/Qwen3-MoE-4L
  config_overrides: null
data:
  train_path: /data/gsm8k/train.parquet
  test_path: /data/gsm8k/test.parquet
  prompt_column: prompt
  answer_column: extra_info
  prompt_instruction: Let's think step by step and output the final answer after "####".
  max_prompt_length: 128
  max_train_samples: 4
  shuffle: false
  num_workers: 0
  prefetch_factor: null
  pin_memory: true
rollout:
  engine: vllm
  num_return_sequences: 2
  max_new_tokens: 32
  ignore_eos: false
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  seed: 20260814
  vllm:
    sleep_level: 1
    deployment: colocated
    data_parallel_size: 2
    port: 8100
    model_implementation: unified
    tensor_parallel_size: 2
    weight_sync:
      strategy: full_gather
      bucket_size_mb: 128
    dtype: bfloat16
    trust_remote_code: false
    enforce_eager: false
    compilation_config:
      mode: 3
      cudagraph_mode: FULL_AND_PIECEWISE
      cudagraph_capture_sizes: [1, 2, 4, 8]
    batch_invariant: false
    enable_prefix_caching: true
    enable_chunked_prefill: true
    gpu_memory_utilization: 0.35
    kv_cache_memory_bytes: 536870912
    max_model_len: 256
    block_size: 128
    max_num_seqs: 2
    max_num_batched_tokens: 128
    logprobs_mode: raw_logprobs
    startup_timeout: 1800
    request_timeout: 600
    enable_prompt_tokens_details: false
    server_hccl_if_base_port: null
    server_hccl_npu_socket_port_range: null
    expert_parallel_size: 4
    sequence_parallel: false
agentic:
  module_path: examples.gsm8k.agent
  environment: gsm8k_tools
  interaction_mode: single_turn
  max_turns: 1
  max_observation_tokens: 0
  protocol: json_function_call
  apply_chat_template: false
  max_episode_tokens: null
  tool_timeout_seconds: 5.0
  tool_max_concurrency: 2
  tool_max_calls_per_turn: 2
evaluation:
  enabled: false
  batch_size: 16
  max_samples: 128
  max_new_tokens: 300
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  do_sample: false
  log_samples: 4
  progress_steps: 4
algorithm:
  name: grpo
  advantage_epsilon: 1.0e-06
  clip_ratio_low: 0.2
  clip_ratio_high: 0.2
  clip_ratio_c: 3.0
  kl_coef: 0.0
  kl_type: low_var_kl
  loss_aggregation: token-mean
train:
  plan_overrides:
  - match:
    - '*.input_layernorm'
    - '*.post_attention_layernorm'
    - model.norm
    replace:
      kind: module
      source_type: transformers.models.qwen3_moe.modeling_qwen3_moe.Qwen3MoeRMSNorm
      implementation:
        _target_: hyper_parallel.models.qwen3_moe.adapter.conversion.module_replacement.replace_qwen3_moe_rms_norm
  - match: '*.self_attn'
    replace:
      kind: module
      source_type: transformers.models.qwen3_moe.modeling_qwen3_moe.Qwen3MoeAttention
      implementation:
        _target_: rl.unified_execution.components.row_parallel.replace_attention_with_pik
        num_leaves: 8
        leaf_layout: strided
        fill_uninitialized_memory: false
  - match: '*.self_attn'
    region_dispatch: false
  - match: '*.mlp.experts'
    replace:
      kind: module
      source_type: transformers.models.qwen3_moe.modeling_qwen3_moe.Qwen3MoeExperts
      implementation:
        _target_: hyper_parallel.models.qwen3_moe.adapter.conversion.module_replacement.replace_qwen3_moe_grouped_experts
  - match: '*.mlp.forward'
    when: ep
    replace:
      kind: method
      implementation:
        _target_: rl.unified_execution.components.moe.fixed_capacity_ep_compute_fn
        capacity: 256
  - match: '*.self_attn.o_proj.forward'
    replace:
      kind: method
      implementation:
        _target_: rl.unified_execution.components.row_parallel.pik_row_compute_fn
        sequence_parallel: false
    params: {}
    in_src:
      input: {tp: shard(2)}
    in_dst:
      input: {tp: shard(2)}
    out_src:
      output: {tp: replicate}
    out_dst:
      output: {tp: replicate}
  - match: '*.self_attn.o_proj.forward'
    when: sequence_parallel
    replace:
      kind: method
      implementation:
        _target_: rl.unified_execution.components.row_parallel.pik_row_compute_fn
        sequence_parallel: true
    params: {}
    in_src:
      input: {tp: shard(2)}
    in_dst:
      input: {tp: shard(2)}
    out_src:
      output: {tp: shard(1)}
    out_dst:
      output: {tp: shard(1)}
  - match: '*.self_attn'
    region_dispatch: false
    out_src:
      output: {tp: replicate, cp: shard(1)}
    out_dst:
      output: {tp: replicate, cp: shard(1)}
  - match: '*.self_attn'
    when: sequence_parallel
    region_dispatch: false
    out_src:
      output: {tp: shard(1), cp: shard(1)}
    out_dst:
      output: {tp: shard(1), cp: shard(1)}
  token_log_probs_mode: dense
  model_init_cpu_threads: null
  max_steps: 2
  seed: 1234
  prompt_batch_size: 2
  micro_batch_size: 1
  response_mini_batch_size: 4
  policy_update_epochs: 1
  init_device: meta
  comm_backend: hccl
  learning_gate:
    enabled: false
    min_gradient_norm: 0.0
    require_mixed_rewards: false
  accelerator:
    requires_grad_sync: true
    reshard_after_backward: false
    loss_parallel: false
    sequence_parallel: true
    dp_replicate: 1
    dp_shard: 1
    tp: 4
    cp: 1
    pp: 1
    reshard_after_forward: true
    comm_fusion: true
    cpu_offload: true
    ep: 4
  mixed_precision:
    enabled: true
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: null
  optimizer:
    lr: 1.0e-06
    lr_min: 0.0
    lr_decay_style: constant
    lr_warmup_ratio: 0.0
    weight_decay: 0.0
    max_grad_norm: 1.0
    eps: 1.0e-08
    betas:
    - 0.9
    - 0.999
    foreach: null
  checkpoint:
    load_path: null
    output_dir: /results/run/checkpoints
    save_steps: 0
    save_final: false
    verify_reload: false
logging:
  backends:
  - console
  project_name: hyper-rl
  experiment_name: qwen3_moe_4l_consistency
  log_steps: 1
  log_samples: 2
  wandb:
    mode: disabled
    entity: null
    directory: /results/run/wandb
consistency:
  schema_version: 1
  mode: batch_invariant
  attention_backend: flash_attention_npu_v4
  batch_invariant:
    provider: torch_npu_level3
    fill_uninitialized_memory: false
