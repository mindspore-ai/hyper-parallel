# ============================================================================
# HyperParallel Auto Parallel Strategy Search — Qwen3 72B Demo
# ============================================================================
# HyperParallel YAML equivalent of ``pretrain_qwen3_72b.yaml`` (MindFormers).
# Model parameters are identical so that users can compare outputs side‑by‑side:
#
#   MF:  python run_nd.py -f mindformers -y nd/yamls/pretrain_qwen3_72b.yaml ...
#   HP:  python run_nd.py -f hyper_v2     -y nd/yamls/hyper_qwen3_72b.yaml ...
#
# Model hyperparameters match Qwen3 72B (80 layers, dim=8192, 64 heads).
# Intended for 128‑card clusters with 54 GB device memory.
# ============================================================================

model:
  name: qwen3_5
  weights_path: /path/to/models/Qwen3-72B-Base
  tokenizer_path: /path/to/models/Qwen3-72B-Base
  param_init_type: "float32"
  compute_dtype: "bfloat16"
  softmax_compute_type: "float32"
  config_overrides:
    vocab_size: 152064
    hidden_size: 8192
    intermediate_size: 29696
    num_hidden_layers: 80
    num_attention_heads: 64
    num_key_value_heads: 8
    max_position_embeddings: 4096
    offset: 0
    multiple_of: 1
    full_rec: [8, 6, 6, 6, 4, 4, 2, 2]
    sel_rec: false

data:
  type: preset_pt
  train_path: /path/to/dataset
  max_seq_len: 4096
  shuffle: false
  num_workers: 0
  pin_memory: true

train:
  max_steps: 20
  num_train_epochs: 1
  global_batch_size: 4608
  micro_batch_size: 1
  micro_batch_num: 144
  seed: 1234
  backend: torch
  init_device: meta

  accelerator:
    dp_shard: 1
    dp_replicate: 32
    tp_degree: 4
    pipeline_parallel_degree: 8
    use_seq_parallel: true
    enable_parallel_optimizer: true
    optimizer_weight_shard_size: 8

  optimizer:
    type: adamw
    lr: 1.0e-4
    lr_min: 0.0
    lr_decay_style: cosine
    lr_warmup_ratio: 0.1
    max_grad_norm: 1.0e9
    weight_decay: 0.0
    loss_aggregation: rank_average

  mixed_precision:
    enabled: true
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: bfloat16

  gradient_checkpointing:
    activation_checkpoint: full
    recompute_slice_activation: false

  checkpoint:
    output_dir: outputs/qwen3_72b
    save_steps: 0
    save_hf_weights: false

  logging:
    log_steps: 1
    report_throughput: false

  debug:
    deterministic: true

context:
  max_device_memory: "54GB"
