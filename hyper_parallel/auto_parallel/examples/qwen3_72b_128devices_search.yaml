# ============================================================================
# HyperParallel Auto Parallel Strategy Search 鈥?Qwen3 72B @ 128 cards
# ============================================================================
# Search configuration mirroring the ISSUE 126 validation experiment (exp6).
# Model parameters match the wanglei profiling experiment's 72B test.
#
# Parallelism dimensions:
#   scalar (e.g. cp: 1) 鈫?fixed input
#   list   (e.g. dp: [1,2,4]) 鈫?search candidate
#
# Reference experiment strategies (all 8 configs 脳 recompute):
#   dp16/tp4/pp2/mb8   dp8/tp8/pp2/mb16   dp8/tp4/pp4/mb16
#   dp4/tp8/pp4/mb32   dp4/tp4/pp8/mb32   dp4/tp2/pp16/mb32
#   dp2/tp8/pp8/mb64   dp1/tp8/pp16/mb128

model:
  name: "qwen3_5"
  num_hidden_layers: 80
  hidden_size: 8192
  intermediate_size: 29568
  num_attention_heads: 64
  num_key_value_heads: 8
  vocab_size: 152064
  max_position_embeddings: 4096
  local_batch_size: 1
  compute_dtype: "bfloat16"
  use_flash_attention: true
  moe_enabled: false
  multiple_of: 1
  param_init_type: "float32"
  softmax_compute_type: "float32"
  optimizer_weight_shard_size: 8
  recompute_slice_activation: false

cluster:
  num_nodes: 16
  cards_per_node: 8
  device_type: "A2"
  device_memory_gb: 54.0

parallelism:
  dp: [1, 2, 4, 8, 16]
  tp: [2, 4, 8]
  pp: [2, 4, 8, 16]
  cp: 1
  ep: 1
  micro_batch_num: [8, 16, 32, 64, 128]

constraint:
  global_batch_size: 1024
  memory_limit_gb: 54.0

recompute: "full"

pp_config:
  stage_partition_mode: "uniform"
  pipeline_schedule: "1F1B"
