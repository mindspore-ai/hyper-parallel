# ============================================================================
# HyperParallel Auto Parallel Strategy Search — MoE LLM Example
# ============================================================================
# This file demonstrates a complete search configuration for a
# Mixture-of-Experts Transformer LLM (e.g. Mixtral-8x7B style).
#
# Parallelism dimensions:
#   scalar (e.g. cp: 1) → fixed input
#   list   (e.g. tp: [1,2,4]) → search candidate (output)
#   "auto" → let the searcher decide the range

model:
  name: "mixtral-8x7b-moe"
  num_hidden_layers: 32
  hidden_size: 4096
  intermediate_size: 14336
  num_attention_heads: 32
  num_key_value_heads: 8
  vocab_size: 32000
  max_position_embeddings: 32768
  local_batch_size: 1
  compute_dtype: "bfloat16"
  use_flash_attention: true
  moe_enabled: true
  num_experts: 8
  num_experts_per_tok: 2
  num_shared_experts: 0
  moe_inter_dim: 14336

cluster:
  num_nodes: 8
  cards_per_node: 8
  device_memory_gb: 64.0
  device_type: "ascend"
  intra_node_bandwidth_gbps: 200.0
  inter_node_bandwidth_gbps: 100.0

parallelism:
  dp: [1, 2, 4]
  fsdp: [1, 2]
  tp: [1, 2, 4, 8]
  pp: [1, 2, 4]
  cp: 1
  ep: [1, 2, 4, 8]
  etp: 1
  micro_batch_num: [1, 2, 4, 8]

constraint:
  global_batch_size: 256
  memory_limit_gb: 60.0

recompute: "full"

pp_config:
  stage_partition_mode: "uniform"
  pp_interleave_num: 1
  pipeline_schedule: "1F1B"
