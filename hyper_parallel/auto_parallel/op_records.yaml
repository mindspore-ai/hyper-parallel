# Op records (shared decision S1): what each op of a layer keeps for its
# backward, as the memory model prices it.
#
# ops: every op of a layer kind, the op vector's names.  An op a recompute
# switch drops names it as its switch; one that names none is kept by every
# selective layer and dropped only by full recompute.  needs names the ops
# whose outputs recomputing it takes; comm marks an op that is
# communication rather than compute.
#
# parts: what of an op's saves a switch of its own drops, apart from the op,
# which keeps the rest: part_of names the op.  What a part keeps counts
# toward its op wherever an op is priced alone.
#
# slots: the memory model's activation formulas.  A slot's formula prices
# what a layer keeps in it, one rank's share of a micro-batch, in bytes,
# over total: the elements its ops keep, each op's as its expression
# states, those a selective layer's switches drop left out.  A slot with a
# when holds only in a layer for which it is true.  The
# expressions are Python arithmetic over the layer config's fields, the
# evaluation's micro_factor and dropless_tok_factor, kv_shards (the CP
# ranks a layer's keys and values are split over) and total; defaults
# answers a field a config may not hold.  Each formula keeps the order its
# code had, so it prices every layer to the same bits.
defaults:
  n_qknorm: 0
ops:
  attMM:
    needs: []
  attBMM:
    switch: attBMM
    needs: [attMM]
  softmax:
    switch: softmax
    needs: [attBMM]
  dropout:
    switch: dropout
    needs: [softmax]
  headCast:
    switch: headCast
    needs: [attBMM]
  normOp:
    switch: normOp
    needs: []
  gather:
    switch: gather
    needs: []
    comm: true
  ffMM:
    needs: []
  ffAct:
    switch: ffAct
    needs: [ffMM]
  linrec:
    needs: [attMM]
parts:
  # The query heads and the key and value heads an MLA layer's
  # up-projections build from the latents it keeps: recomputing the
  # up-projections builds them again.  The queries' only where they have a
  # latent of their own; without one, a projection builds them from the
  # layer's input.
  attUp:
    part_of: attMM
    switch: attUp
    needs: [attMM]
slots:
  # The projections' inputs, and the keys and values an attention keeps: an
  # MLA layer's latents, and its heads, which its up-projections build.
  # Every term counts elements, so the two entries sum to what one
  # expression summed, to the bit.
  qkv:
    part: attention
    formula: micro_factor * (s * b * bytes_compute * total) / (t * cp)
    ops:
      attMM: >-
        0.25 * (n_attMM + n_attParamCast) * h
        + 0.5 * (n_attMM + n_attParamCast) * dh * n_kv * cp / kv_shards
        if dc_kv == 0 else
        0.25 * (n_attMM + n_attParamCast) * (dc_q + (0 if dc_q else 2 * a * (dh + dhr)))
        + (0.25 * (n_attMM + n_attParamCast) * dhr
           + 0.25 * (n_attMM + n_attParamCast) * (n_kv * dh + dc_kv)) * cp / kv_shards
      attUp: >-
        0 if dc_kv == 0 else
        0.25 * (n_attMM + n_attParamCast) * (2 * a * (dh + dhr) if dc_q else 0)
        + 0.25 * (n_attMM + n_attParamCast) * n_kv * (2 * dh + dhr) * cp / kv_shards
      attBMM: n_attBMM * dh
  # The scores' softmax, its dropout mask and the scores' cast, per head.
  score:
    part: attention
    formula: micro_factor * (s_fa * b * a * s * total) / (t * cp * 1)
    ops:
      softmax: n_softmax * bytes_softmax
      dropout: n_softmax * bytes_dropout
      headCast: n_softmax * bytes_compute
  # The output projection's input and its dropout mask.
  proj:
    part: attention
    formula: micro_factor * (s * b * h * bytes_compute * total) / max(sp, cp)
    ops:
      attMM: 0.25 * (n_attMM + n_attParamCast)
      dropout: n_dropout * bytes_dropout
  # A dense feed-forward: its projections' inputs and casts, and its
  # activation's input.
  ffn:
    part: ffn
    when: n_exp == 1
    formula: micro_factor * (s * b) * total / (t * cp)
    ops:
      ffMM: >-
        (0.5 * h + 0.5 * hff if n_ffMM % 2 == 0 else 1 / 3 * h + 2 / 3 * hff) * (bytes_compute * n_ffMM)
        + bytes_compute * hff * n_ffParamCast
      ffAct: bytes_compute * hff
  # A MoE layer's routed experts, each as wide as the model states them,
  # for the tokens each expert takes: at capacity, or as they route.
  routed:
    part: ffn
    when: n_exp != 1
    formula: >-
      micro_factor * (s * b) * total / (t * cp) / (s * b)
      * (s * b * n_chosen_exp / n_exp * cap_fact * n_exp if not gmm
         else s * b * n_chosen_exp / n_exp * n_exp * dropless_tok_factor)
    ops:
      ffMM: >-
        (0.5 * h + 0.5 * hff_exp if n_ffMM % 2 == 0 else 1 / 3 * h + 2 / 3 * hff_exp) * (bytes_compute * n_ffMM)
        + bytes_compute * hff_exp * n_ffParamCast
      ffAct: bytes_compute * hff_exp
  # A MoE layer's shared experts, each as wide as a routed one.
  shared:
    part: ffn
    when: n_exp != 1
    formula: n_shared_exp * (micro_factor * (s * b) * total / (t * cp))
    ops:
      ffMM: >-
        (0.5 * h + 0.5 * hff_exp if n_ffMM % 2 == 0 else 1 / 3 * h + 2 / 3 * hff_exp) * (bytes_compute * n_ffMM)
        + bytes_compute * hff_exp * n_ffParamCast
      ffAct: bytes_compute * hff_exp
  # A MoE layer's router, its logits, probabilities and choices, and the
  # experts' combined output.
  router:
    part: ffn
    when: n_exp != 1
    formula: micro_factor * total / (t * cp)
    ops:
      ffMM: s * b * bytes_compute * (2 * n_exp + n_chosen_exp) + s * b * bytes_compute * h
  # The norms' inputs, and a QK-norm's every head's queries and keys.
  norm:
    part: norm
    formula: micro_factor * (s * b * bytes_norm * total) / (t * cp)
    ops:
      normOp: h * n_normOp + n_qknorm * (a + n_kv) * (dh or (h / a if a else 0))
