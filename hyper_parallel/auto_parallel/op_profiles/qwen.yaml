# Qwen: the default decoder.  The family differs only in its run, which
# shards the activations between layers, and the output layer's, over
# tensor parallelism.
run:
  shard_activations: true
kinds:
  decoder:
    ops:
      attMM: 4
      attBMM: 2
      ffMM: 3
      softmax: 1
      dropout: 0
      normOp: 2
      gather: 4
      headCast: 1
      ffAct: 1
      linrec: 0
