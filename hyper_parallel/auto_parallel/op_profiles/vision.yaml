# Vision tower of a multimodal model: ViT blocks with a plain two-projection
# feed-forward rather than a gated one.
kinds:
  encoder:
    ops:
      attMM: 4
      attBMM: 2
      ffMM: 2
      softmax: 1
      dropout: 0
      normOp: 2
      gather: 4
      headCast: 1
      ffAct: 1
      linrec: 0
