# codegen combination-test case: qwen3 tp=8 cp=1 ep=1 pp=1
model:
  _target_: hyper_parallel.models.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: /home/lxy/probe_ckpts/qwen3
  torch_dtype: bfloat16
  attn_implementation: eager
  force_hf: false

training:
  train_iters: 1
  global_batch_size: 1
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  seed: 42

accelerator:
  tp_size: 8
  cp_size: 1
  ep_size: 1
  pp_size: 1

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: "off"

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    lr: 1.0e-5
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 1.0e-5
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ""
  restore_from: null

plan_overrides:
  - match:
      - "*.input_layernorm"
      - "*.post_attention_layernorm"
      - "model.norm"
    replace:
      kind: module
      source_type: transformers.models.qwen3.modeling_qwen3.Qwen3RMSNorm
      implementation:
        _target_: hyper_parallel.models.qwen3.adapter.conversion.module_replacement.replace_qwen3_rms_norm
  - match: "*.self_attn"
    replace:
      kind: module
      source_type: transformers.models.qwen3.modeling_qwen3.Qwen3Attention
      implementation:
        _target_: hyper_parallel.models.qwen3.adapter.conversion.module_replacement.replace_qwen3_flash_attention
  - match: "*.mlp"
    replace:
      kind: module
      source_type: transformers.models.qwen3.modeling_qwen3.Qwen3MLP
      implementation:
        _target_: hyper_parallel.models.qwen3.adapter.conversion.module_replacement.replace_qwen3_swiglu_mlp
