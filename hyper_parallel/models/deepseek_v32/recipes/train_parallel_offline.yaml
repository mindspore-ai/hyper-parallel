# Eight-rank DeepSeek-V3.2 training on an 8-layer crop with TP + CP + EP, FSDP,
# fused DSA, and grouped routed experts.
#
# The crop keeps 3 dense + 5 MoE layers and 16 routed experts; README.md
# describes how to create it. The data is an Indexed Dataset tokenized with the
# DeepSeek-V3.2 tokenizer. run_parallel_offline.sh fills in both paths.

model:
  _target_: hyper_parallel.models.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: /path/to/DeepSeek-V3.2-8layer-crop
  torch_dtype: bfloat16
  attn_implementation: sdpa
  validate_placement: false

model_init_dtype: float32

training:
  train_iters: 50
  train_samples: null
  eval_iters: 0
  global_batch_size: 2
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 1234
  enable_full_determinism: true

accelerator:
  tp_size: 2
  cp_size: 2
  ep_size: 4
  pp_size: 1
  sequence_parallel: false
  loss_parallel: true

fsdp_config:
  dp_shard_size: 2
  edp_shard_size: 2
  replicate_params: []
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: float32
    cast_forward_inputs: false
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

plan_overrides:
  - match:
      - "*.input_layernorm"
      - "*.post_attention_layernorm"
      - model.norm
    replace:
      kind: module
      implementation:
        _target_: hyper_parallel.models.deepseek_v32.adapter.conversion.module_replacement.replace_deepseek_v32_rms_norm
  - match: "*.self_attn"
    replace:
      kind: module
      implementation:
        _target_: hyper_parallel.models.deepseek_v32.adapter.conversion.module_replacement.replace_deepseek_v32_dsa_attention
  - match: "*.mlp.experts"
    replace:
      kind: module
      implementation:
        _target_: hyper_parallel.models.deepseek_v32.adapter.conversion.module_replacement.replace_deepseek_v32_grouped_experts
  - match: "*.self_attn.forward"
    when: cp
    replace:
      kind: method
      implementation:
        _target_: hyper_parallel.models.deepseek_v32.adapter.distributed.context_parallel.deepseek_v32_dsa_attention_cp_wrapper
        dense_warmup: null
  # MoE layers of the crop: layers 3-7 (first_k_dense_replace = 3).
  - match: "model.layers.[3-7].mlp.forward"
    when: ep
    replace:
      kind: method
      implementation:
        _target_: hyper_parallel.distributed.expert_parallel.recipes.deepseekv3_ep_compute_fn
        use_grouped_gemm: true
        overlap_shared_expert: true

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: full

activation_swap: none

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

dataset:
  model_assets:
    chat_template: null
    tokenizer:
      _target_: hyper_parallel.data.text.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: /path/to/DeepSeek-V3.2-8layer-crop
      local_files_only: true
      tokenizer_type: pretokenized
      vocab_size: 129280
      eod_token_id: 1
  _target_: hyper_parallel.data.text.build_dataset.build_indexed_text_dataset
  data_path: /path/to/dataset_text_document
  data_config:
    seq_length: 4096
    split: "100,0,0"
    mock_data: false
    distributed_walk: true
    is_dataset_from_mr: false
    simple_blend: "no"
    data_lazy_load: true
    skip_data_check: true
    labels_are_shifted: true
    create_attention_mask_in_dataloader: false
    create_ltor_fields_in_dataloader: false
    data_cache_path: ./outputs/deepseek_v32/data_cache
    low_level_dataset:
      _target_: hyper_parallel.data.indexed.indexed_pretrain_dataset.GPTDataset

dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.batching.build_indexed_collate_fn
  get_batch:
    _target_: hyper_parallel.data.batching.TextParallelBatch
    source_type: indexed
    attention_mode: compressed
  sampler_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  fp32_main_params: true
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    lr: 1.0e-5
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8
  swap:
    enabled: true

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 1.0e-5
    lr_warmup_steps: 0
    min_lr: 1.0e-7

checkpoint:
  save_ckpt: false
  checkpoint_dir: ./outputs/deepseek_v32/checkpoints
  restore_from: null

debug:
  check_nan_inf: false
  check_dataset: null
