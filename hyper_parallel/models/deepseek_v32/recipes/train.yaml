# DeepSeek-V3.2 single-device Trainer recipe.
#
# The model configuration, tokenizer, and weights come from the official
# Hugging Face checkpoint. Parallel topology sections are intentionally
# omitted, so Trainer defaults keep TP/CP/EP/PP and FSDP degrees at 1. The
# conditional CP override remains available and is activated only when a user
# explicitly sets accelerator.cp_size greater than 1.
#
# DeepSeek-V3.2 is a very large model; running this recipe requires a device
# with enough memory for the selected checkpoint and optimizer states. Local
# or offline assets can be selected with dotted overrides, for example:
#   scripts/train_lm.py <this file> \
#     --model.pretrained_model_name_or_path=/path/to/DeepSeek-V3.2 \
#     --dataset.model_assets.tokenizer.pretrained_model_name_or_path=/path/to/DeepSeek-V3.2

model:
  _target_: hyper_parallel.models.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: deepseek-ai/DeepSeek-V3.2
  torch_dtype: bfloat16
  attn_implementation: eager
  force_hf: true

training:
  train_iters: 3
  train_samples: null
  global_batch_size: 1
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true

plan_overrides:
  - match:
      - "*.input_layernorm"
      - "*.post_attention_layernorm"
      - model.norm
    module_type: transformers.models.deepseek_v32.modeling_deepseek_v32.DeepseekV32RMSNorm
    replace_module:
      _target_: >-
        hyper_parallel.models.deepseek_v32.adapter.conversion.module_replacement.replace_deepseek_v32_rms_norm
  - match: "*.self_attn"
    module_type: transformers.models.deepseek_v32.modeling_deepseek_v32.DeepseekV32Attention
    replace_module:
      _target_: >-
        hyper_parallel.models.deepseek_v32.adapter.conversion.module_replacement.replace_deepseek_v32_dsa_attention
  - match: "*.mlp.experts"
    module_type: transformers.models.deepseek_v32.modeling_deepseek_v32.DeepseekV32Experts
    replace_module:
      _target_: >-
        hyper_parallel.models.deepseek_v32.adapter.conversion.module_replacement.replace_deepseek_v32_grouped_experts
  - match: "*.self_attn"
    when: cp
    region_dispatch: false
    inner_target: self
    inner_wrapper:
      _target_: hyper_parallel.models.deepseek_v32.adapter.distributed.context_parallel.deepseek_v32_dsa_attention_cp_wrapper

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: full

activation_swap: none

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

dataset:
  model_assets:
    chat_template: null
    tokenizer:
      _target_: hyper_parallel.data.text.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: deepseek-ai/DeepSeek-V3.2
      use_fast: true
      trust_remote_code: true
  data_transform:
    _target_: hyper_parallel.data.text.text_transform.build_text_transform
    data_type: plaintext
    text_keys: text
    max_seq_len: 4096
  data_config:
    config_name: wikitext-2-raw-v1
    cache_dir: null
    labels_are_shifted: true
    create_attention_mask_in_dataloader: true
    create_ltor_fields_in_dataloader: false
  _target_: hyper_parallel.data.text.build_dataset.build_online_text_mapping_dataset
  data_path: Salesforce/wikitext

dataloader:
  _target_: hyper_parallel.data.batching.TokenBatchLoader
  min_buffered_samples: 200
  collate_fn:
    _target_: hyper_parallel.data.batching.build_online_text_collate_fn
  get_batch:
    _target_: hyper_parallel.data.batching.TextParallelBatch
    source_type: online
    attention_mode: dense
  sampler_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    lr: 1.0e-5
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 1.0e-5
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ./outputs/deepseek_v32/checkpoints
  save_steps: 10
  save_epochs: 1
  is_async: false
  save_optimizer: true
  save_train_state: true
  save_extra_state_per_rank: false
  restore_from: null
  restore_optimizer: true
  restore_train_state: true

debug:
  check_nan_inf: false
  check_dataset: null

profiling:
  enabled: false
  start_step: 3
  end_step: 4
  trace_dir: ./outputs/deepseek_v32/profiling
  record_shapes: false
  profile_memory: false
  with_stack: false
  with_modules: false
  rank: 0
