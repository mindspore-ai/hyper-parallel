train:
  max_steps: 100
  num_train_epochs: 1
  global_batch_size: 4
  micro_batch_size: 1
  seed: 1234
  backend: torch
  init_device: meta
  accelerator:
    dp_shard: 1
    comm_fusion: true
  optimizer:
    type: adamw
    lr: 1.0e-4
    lr_min: 1.0e-4
    lr_decay_style: constant
    lr_warmup_ratio: 0.0
    max_grad_norm: 10000.0
    weight_decay: 0.0
    loss_aggregation: token_weighted
    foreach: false
  mixed_precision:
    enabled: true
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: float32
  gradient_checkpointing:
    activation_checkpoint: none
  checkpoint:
    output_dir: outputs/92bvl
    save_steps: 0
    save_hf_weights: false
  logging:
    log_steps: 1
    report_throughput: false
  debug:
    deterministic: true