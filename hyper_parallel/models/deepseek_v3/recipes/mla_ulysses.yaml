# Dense MLA CP recipe fragment. Merge into a DeepSeek-V3 training configuration.
# The model factory/checkpoint, data pipeline and optimizer remain caller choices.
accelerator:
  tp_size: 2
  cp_size: 4
  sequence_parallel: false  # Optional TP sequence parallelism; both MLA strategies support enabling it.
  loss_parallel: false

plan_overrides:
  - match: "model.layers.*.self_attn"
    replace:
      kind: module
      implementation:
        _target_: hyper_parallel.components.modules.MultiLatentAttention
        strategy: expanded_ulysses
        overlap: false  # Enable forward and supported backward communication overlap.
        # At TP1: 1 selects KV AllGather; intermediate CP divisors select Ulysses x AllGather.
        # ulysses_degree: 2

fsdp_config:
  dp_shard_size: 4
  reshard_after_forward: true
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: bfloat16
