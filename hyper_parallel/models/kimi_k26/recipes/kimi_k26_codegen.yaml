model:
  _target_: hyper_parallel.models.HyperAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: /home/lxy/probe_ckpts/kimi_k26
  torch_dtype: bfloat16
  attn_implementation: eager
  force_hf: false

training:
  train_iters: 1
  global_batch_size: 1
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  seed: 42

accelerator:
  tp_size: 2
  cp_size: 1
  ep_size: 2
  pp_size: 1
  sequence_parallel: true

fsdp_config:
  dp_shard_size: 4

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: "off"

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    lr: 1.0e-5
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 1.0e-5
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ""
  restore_from: null

plan_overrides:
  # seq2048 variant: the seq4096 run OOM'd at step 0 (54.59GB allocated on NPU,
  # i.e. our own working set, vs 44.25GB for the text-tower-only full run).
  # NB: the 166 vision-tower leaf specs below are required whenever EP >= 1
  # (their role-based boundaries collapse under whole-tower replication, so the
  # planner needs explicit per-leaf parameter specs to pass the coverage check).
  # FSDP-only runs (ep_size: 1, e.g. the train_kimi_vlm demo) do not need them.
  # 文本塔全部 norm 换成融合 NPU RMSNorm（61 层 x 4 处 + 最终 norm）。
  # 机制要求：每个 pattern 至少命中一个模块，且命中模块类型必须完全匹配，
  # 因此 FQN 写全；RMSNorm 组件复用源模块的 weight/eps（state_dict 与切分均不变）。
  - match: "model.language_model.layers.[123456789]*.mlp.forward"
    when: ep
    replace:
      kind: method
      implementation:
      # 家族自带的 EP 工厂（adapter/distributed/ep_compute.py）：fix_router=true 使用均衡路由，
      # 避免真实路由的 token 倾斜把最忙的 rank 打爆显存 / 拖慢整步。
      # ⚠️ 该模式是 benchmark-only：忽略 gate 分数，loss/grad_norm/专家命中分布无意义，
      # 正确性与收敛性验证必须置 false（此时回落到框架的 sigmoid-group 真实路由）。
        _target_: hyper_parallel.models.kimi_k26.adapter.distributed.ep_compute.kimi_k26_ep_compute_fn
        fix_router: true
        use_grouped_gemm: true
      # 2SN 参考数值是在共享专家重叠下测的：关掉会让 routed 分支暴露整段交换
      # （GBS 256 实测 +2.28 GB 峰值、步时 +22%）。
        overlap_shared_expert: true

  # 视觉塔 27 层 × 6 个模块在 TP 下全部 replicate：用 glob 收敛，等价于逐层展开的 162 条。
  # 本模型 FQN 空间里 layers.<i> 下只有 attn.* / mlp.*，`*` 跨点号不会命中别的子模块。
  - match: model.vision_tower.layers.*.attn.q_proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.*.attn.k_proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.*.attn.v_proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.*.attn.proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.*.mlp.fc1
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.*.mlp.fc2
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.patch_embed.proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.patch_embed.pos_emb
    params:
      position_embeddings: {tp: replicate}
  - match: model.mm_projector.in_proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.mm_projector.out_proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
