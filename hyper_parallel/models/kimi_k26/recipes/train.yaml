# Kimi-K2.6 多模态训练配方（主线规模：4 超节点 / 512 卡 Ascend NPU，hccl backend）。
#
# 拓扑：cp 1 × dp_shard 512（= edp 4 × ep 128），GBS 512 = 512 × MBS 1，序列长度 8192。
# 这是本族在 4SN 上实测的最优形状：最小步时 18.2617 s，padded 吞吐 228,873 tok/s，
# 峰值 allocated 39.19 GB（无 activation swap：edp=4 已把专家参数摊薄到每卡 1/4）。
#
# 依赖 Kimi-K2.6 多模态 checkpoint：用 transformers 原生 kimi_k25 实现 + 原生 processor
# （image_grid_thw 协议），因此 model 与 dataset.model_assets 都保持 trust_remote_code:
# false。模型目录与 processor 目录是同一个；本地/离线资源用命令行覆盖，见同目录
# run_kimi_k26_4sn.sh 的用法说明。
#
# 演示数据由同目录脚本生成（默认 8 条；吞吐测试建议 --num-samples 1024 量级）：
#   python hyper_parallel/models/kimi_k26/recipes/prepare_kimi_vlm_data.py \
#     --output-dir ./kimi_k26_demo_data --num-samples 1024

model:
  _target_: hyper_parallel.models.kimi_k26.adapter.validation.cropped_model.build_cropped_kimi_vlm
  pretrained_model_name_or_path: moonshotai/Kimi-K2.6
  config_path: moonshotai/Kimi-K2.6
  num_hidden_layers: 61
  n_routed_experts: 384
  trust_remote_code: false          # processor 走 native（image_grid_thw 协议）
  local_files_only: false
  torch_dtype: bfloat16
  attn_implementation: sdpa
  validate_placement: false
  # Freeze the media tower's gradients, matching the MindSpeed baseline so the two are
  # comparable. Applied inside the model build BEFORE plan/FSDP derivation, so the tower
  # also leaves the gradient all-reduce, and autograd stops at its output -- its backward
  # pass and saved activations disappear. Pattern is an fnmatch glob on the FQN; a pattern
  # that matches nothing raises instead of silently leaving the tower trainable.
  freeze_patterns: ["model.vision_tower*"]

training:
  train_iters: 6
  train_samples: null
  eval_iters: 0

  global_batch_size: 512
  micro_batch_size: 1

  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: false

  # Per-card peak dense BF16 TFLOPS for MFU normalization (400 = the team's
  # HP_MFU_PEAK_TFLOPS convention); MFU is skipped while unset.
  peak_tflops: 400.0

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 128
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 128
  edp_shard_size: 4
  enable_offload: false
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 3
  backward_prefetch_depth: 3
  comm_fusion: false

plan_overrides:
  # seq2048 variant: the seq4096 run OOM'd at step 0 (54.59GB allocated on NPU,
  # i.e. our own working set, vs 44.25GB for the text-tower-only full run).
  # NB: the 166 vision-tower leaf specs below are required whenever EP >= 1
  # (their role-based boundaries collapse under whole-tower replication, so the
  # planner needs explicit per-leaf parameter specs to pass the coverage check).
  # FSDP-only runs (ep_size: 1, e.g. the train_kimi_vlm demo) do not need them.
  # 文本塔全部 norm 换成融合 NPU RMSNorm（61 层 x 4 处 + 最终 norm）。
  # 机制要求：每个 pattern 至少命中一个模块，且命中模块类型必须完全匹配，
  # 因此 FQN 写全；RMSNorm 组件复用源模块的 weight/eps（state_dict 与切分均不变）。
  - match:
      - "model.language_model.*.input_layernorm"
      - "model.language_model.*.post_attention_layernorm"
      - "model.language_model.*.self_attn.q_a_layernorm"
      - "model.language_model.*.self_attn.kv_a_layernorm"
      - model.language_model.norm
    module_type: transformers.models.deepseek_v3.modeling_deepseek_v3.DeepseekV3RMSNorm
    exact_type: true
    replace_module:
      _target_: hyper_parallel.components.modules.RMSNorm

  # 文本塔 MoE 走 EP（deepseekv3 archetype；排除 first_k_dense_replace=1 的稠密 layer0）
  - match: "model.language_model.layers.[123456789]*.mlp"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: hyper_parallel.distributed.expert_parallel.recipes.deepseekv3_ep_compute_fn
      # 负载均衡档（benchmark-only）：每个 rank 拿到完全相同的 token 数。
      # loss/grad_norm 无意义，只用于稳定的性能对比，不可报有效算力。
      fix_router: true
      use_grouped_gemm: true
      overlap_shared_expert: true

  - match: model.vision_tower.layers.0.attn.q_proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.0.attn.k_proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.0.attn.v_proj
    params:
