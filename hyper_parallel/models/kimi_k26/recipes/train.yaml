      bias: {tp: replicate}
  - match: model.vision_tower.layers.0.mlp.fc1
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.0.mlp.fc2
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
