mixed_precision:
  enabled: false

activation_checkpoint:
  mode: full
  # Activation offload (boundary inputs -> host). Needed for headroom: with 8 images
  # kept per sample the vision activations are large. NOTE the effective key is HERE;
  # a `swap_inputs` in the model: section is accepted but silently dropped.
  swap_inputs: false

activation_swap: none

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

dataset:
  # Model-owned processor: built through the Omni ``model_assets`` target so the VLM
  # trainer forwards ``model.trust_remote_code`` to ``AutoProcessor``.
  model_assets:
    _target_: hyper_parallel.data.omni.omni_transform.build_auto_processor
    pretrained_model_name_or_path: moonshotai/Kimi-K2.6
    trust_remote_code: false          # native kimi_k25 processor (image_grid_thw protocol)
    local_files_only: false
  data_transform:
    # Eager (padding) Kimi transform: encodes one sample and pads it to max_seq_len,
    # which is the shape the fixed-sample throughput arms below measure.
    _target_: hyper_parallel.data.omni.kimi_transform.build_kimi_omni_transform
    max_seq_len: 8192
    # ARM H: align the image budget with MindSpeed-MM. Their kimi_k3 config sets
    # image_max_pixels: 262144 (=512*512) and resizes by sqrt(max_px/(w*h)) before
    # the processor; a 1024x1024 image then becomes 512x512 -> grid [1,38,38] ->
    # 361 <|media_pad|> tokens. Without it our processor accepts 1024x1024 raw ->
    # grid [1,74,74] -> 1369 tokens/image, so 10 images = 13690 > 12288 and the
    # assistant turn is truncated away entirely (loss = 0).
    image_max_pixels: 262144
  _target_: hyper_parallel.data.omni.build_dataset.build_online_omni_mapping_dataset
  # 演示数据：先跑同目录的 prepare_kimi_vlm_data.py 生成；真实数据（COCO 等）直接用
  # --dataset.data_path 覆盖。
  data_path: ./kimi_k26_demo_data/data.json
  data_config:
    # Random/mock dataset for throughput testing: keep every record. The filter has to
    # transform the whole dataset during construction (per rank), which is prohibitive
    # for 10240 records x 10 images; off, construction is O(1).
    filter_trainable: false

dataloader:
  # Fixed-sample, pad-to-max_seq_len path (NOT packed): the eager Omni Kimi transform pads
  # every sample to max_seq_len, OmniCollator stacks the equal-length rows, and the shipped
  # padded-token throughput numbers come from this shape. The token-budget packing path is
  # only the COCO real-data arm.
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.batching.build_omni_collate_fn
  get_batch:
    # OmniParallelBatch 默认 labels_are_shifted=True：它发布的 shift_labels 就是
    # ChunkedCausalLMLoss 需要的预移位目标（本配方 loss_fn 用 chunk loss）。
    _target_: hyper_parallel.data.batching.OmniParallelBatch
  sampler_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2

optimizer:
  _target_: hyper_parallel.components.optim.builders.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ""
  restore_from: null

debug:
  check_nan_inf: true
  check_dataset: null

profiling:
  enabled: false
  start_step: 3
  end_step: 5
  trace_dir: ./outputs/profiling
  record_shapes: false
  profile_memory: false
  with_stack: false
  with_modules: false
  rank: 0

loss_fn:
  _target_: hyper_parallel.components.losses.chunked_cross_entropy.ChunkedCausalLMLoss
  chunk_size: 4096
