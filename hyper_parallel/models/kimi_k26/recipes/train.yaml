# Kimi-K2.6 多模态训练配方（主线规模：4 超节点 / 512 卡 Ascend NPU，hccl backend）。
#
# 拓扑：cp 1 × dp_shard 512（= edp 4 × ep 128），GBS 512 = 512 × MBS 1，序列长度 8192。
# 该拓扑沿用旧版均衡路由 benchmark 的配置。当前 GroupedExperts 路径使用模型原生路由。
#
# 依赖 Kimi-K2.6 多模态 checkpoint：用 transformers 原生 kimi_k25 实现 + 原生 processor
# （image_grid_thw 协议），因此 model 与 dataset.model_assets 都保持 trust_remote_code:
# false。模型目录与 processor 目录是同一个；本地/离线资源用命令行覆盖，见同目录
# run_kimi_k26_4sn.sh 的用法说明。
#
# 演示数据由同目录脚本生成（默认 8 条；吞吐测试建议 --num-samples 1024 量级）：
#   python hyper_parallel/models/kimi_k26/recipes/prepare_kimi_vlm_data.py \
#     --output-dir ./kimi_k26_demo_data --num-samples 1024

model:
  _target_: hyper_parallel.models.HyperAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: moonshotai/Kimi-K2.6
  load_base_model: false
  trust_remote_code: false          # processor 走 native（image_grid_thw 协议）
  local_files_only: false
  torch_dtype: bfloat16
  attn_implementation: sdpa
  validate_placement: false
  # Freeze the media tower's gradients, matching the MindSpeed baseline so the two are
  # comparable. Applied inside the model build BEFORE plan/FSDP derivation, so the tower
  # also leaves the gradient all-reduce, and autograd stops at its output -- its backward
  # pass and saved activations disappear. Pattern is an fnmatch glob on the FQN; a pattern
  # that matches nothing raises instead of silently leaving the tower trainable.
  freeze_config: ["model.vision_tower*"]

model_init_dtype: float32

training:
  train_iters: 6
  train_samples: null
  eval_iters: 0

  global_batch_size: 512
  micro_batch_size: 1

  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: false

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 128
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: float32
    cast_forward_inputs: false
  dp_shard_size: 128
  edp_shard_size: 4
  enable_offload: false
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 3
  backward_prefetch_depth: 3
  comm_fusion: false

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: 'off'

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

dataset:
  training_mode: sft
  # Model-owned processor: built through the Omni ``model_assets`` target so the VLM
  # trainer forwards ``model.trust_remote_code`` to ``AutoProcessor``.
  model_assets:
    _target_: hyper_parallel.data.omni.omni_transform.build_auto_processor
    pretrained_model_name_or_path: moonshotai/Kimi-K2.6
    trust_remote_code: false          # native kimi_k25 processor (image_grid_thw protocol)
    local_files_only: false
  data_transform:
    # Eager (padding) Kimi transform: encodes one sample and pads it to max_seq_len,
    # which is the shape the fixed-sample throughput arms below measure.
    _target_: hyper_parallel.models.kimi_k26.dataset_preprocessing.transform_fn.build_kimi_omni_transform
    max_seq_len: 8192
    # ARM H: align the image budget with MindSpeed-MM. Their kimi_k3 config sets
    # image_max_pixels: 262144 (=512*512) and resizes by sqrt(max_px/(w*h)) before
    # the processor; a 1024x1024 image then becomes 512x512 -> grid [1,38,38] ->
    # 361 <|media_pad|> tokens. Without it our processor accepts 1024x1024 raw ->
    # grid [1,74,74] -> 1369 tokens/image, so 10 images = 13690 > 12288 and the
    # assistant turn is truncated away entirely (loss = 0).
    image_max_pixels: 262144
  _target_: hyper_parallel.data.omni.build_dataset.build_online_omni_mapping_dataset
  # 演示数据：先跑同目录的 prepare_kimi_vlm_data.py 生成；真实数据（COCO 等）直接用
  # --dataset.data_path 覆盖。
  data_path: ./kimi_k26_demo_data/data.json
  data_config:
    # Random/mock dataset for throughput testing: keep every record. The filter has to
    # transform the whole dataset during construction (per rank), which is prohibitive
    # for 10240 records x 10 images; off, construction is O(1).
    filter_trainable: false

dataloader:
  # Fixed-sample, pad-to-max_seq_len path (NOT packed): the eager Omni Kimi transform pads
  # every sample to max_seq_len, OmniCollator stacks the equal-length rows, and the shipped
  # padded-token throughput numbers come from this shape. The token-budget packing path is
  # only the COCO real-data arm.
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.batching.build_omni_collate_fn
  get_batch:
    # OmniParallelBatch 默认 labels_are_shifted=True：它发布的 shift_labels 就是
    # ChunkedCausalLMLoss 需要的预移位目标（本配方 loss_fn 用 chunk loss）。
    _target_: hyper_parallel.data.batching.OmniParallelBatch
  sampler_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 8
  pin_memory: true
  prefetch_factor: 2

optimizer:
  _target_: hyper_parallel.components.optim.builders.AdamW
  fp32_main_params: true
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ""
  restore_from: null

debug:
  check_nan_inf: true
  check_dataset: null

profiler:
  enable: false
  start_step: 3
  stop_step: 4
  output_path: ./outputs/profiling
  memory: false
  with_stack: false
  rank_ids: [0]

loss_fn:
  # Omni batches supply raw labels; the public loss owns the next-token shift.
  _target_: hyper_parallel.components.losses.ChunkedCausalLMLoss
  chunk_size: 4096
  labels_are_shifted: false
