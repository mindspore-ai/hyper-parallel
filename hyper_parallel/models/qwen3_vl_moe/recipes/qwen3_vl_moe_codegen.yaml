# codegen combination-test case: qwen3_vl_moe tp=2 cp=1 ep=2 pp=1
model:
  _target_: hyper_parallel.models.HyperAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: /home/lxy/probe_ckpts/qwen3_vl_moe
  torch_dtype: bfloat16
  attn_implementation: eager
  force_hf: false

training:
  train_iters: 1
  global_batch_size: 1
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  seed: 42

accelerator:
  tp_size: 2
  cp_size: 1
  ep_size: 2
  pp_size: 1

fsdp_config:
  dp_shard_size: 4

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: "off"

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    lr: 1.0e-5
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 1.0e-5
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ""
  restore_from: null

plan_overrides:
  - match: "model.language_model.*.mlp.forward"
    when: ep
    replace:
      kind: method
      implementation:
        _target_: hyper_parallel.models.qwen3_moe.adapter.distributed.expert_parallel.qwen3moe_ep_compute_fn
        use_grouped_gemm: true
  - match: "model.language_model.*.self_attn.forward"
    when: cp
    replace:
      kind: method
      implementation:
        _target_: hyper_parallel.models.qwen3_vl_moe.adapter.distributed.context_parallel.qwen3_vl_moe_async_ulysses_cp_wrapper
