#operator mega_moe
mega_moe:
  args:
    dispatch_target:
      dtype: tensor
    dispatch_target_off:
      dtype: tensor
    dispatch_src:
      dtype: tensor
    dispatch_src_off:
      dtype: tensor
    dispatch_size:
      dtype: tensor
    up_proj_weight:
      dtype: tensor
    up_proj_glist:
      dtype: tensor
    up_proj_y:
      dtype: tensor
    swiglu_out:
      dtype: tensor
    down_proj_weight:
      dtype: tensor
    down_proj_glist:
      dtype: tensor
    down_proj_y:
      dtype: tensor
    combine_target:
      dtype: tensor
    combine_target_off:
      dtype: tensor
    combine_src_off:
      dtype: tensor
    combine_size:
      dtype: tensor
    gmm_workspace:
      dtype: tensor
    up_proj_tiling:
      dtype: tensor
    swiglu_tiling:
      dtype: tensor
    down_proj_tiling:
      dtype: tensor
    runtime_config:
      dtype: tensor
    all_event_counters:
      dtype: tensor
    rank_id:
      dtype: int
      default: 0
    ep:
      dtype: int
      default: 0
    expert_num:
      dtype: int
      default: 0
    hidden_size:
      dtype: int
      default: 0
    seq_size:
      dtype: int
      default: 0
  returns:
    dispatch_target_output:
      dtype: tensor
      inplace: dispatch_target
    up_proj_y_output:
      dtype: tensor
      inplace: up_proj_y
    swiglu_out_output:
      dtype: tensor
      inplace: swiglu_out
    down_proj_y_output:
      dtype: tensor
      inplace: down_proj_y
    combine_target_output:
      dtype: tensor
      inplace: combine_target
  args_signature:
    rw_write: dispatch_target,up_proj_y,swiglu_out,down_proj_y,combine_target
  labels:
    side_effect_mem: True
  function:
    disable: True
  dispatch:
    enable: False
