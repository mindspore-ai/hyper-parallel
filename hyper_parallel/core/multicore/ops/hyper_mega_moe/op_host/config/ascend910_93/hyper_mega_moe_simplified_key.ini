; This file controls the --simplified_key_mode value used by opc when compiling binary kernels.
; [OperatorName]
; default=xx
; ascendxx=xx
; default is the fallback mode, while ascendxx optionally overrides it for a specific platform.
; 1) Without configuration, non-AscendC operators omit the option and AscendC operators use mode 0.
; 2) With only default configured, every platform uses the default value.
; 3) With only platform values, matching platforms use them; other platforms follow rule 1.
; 4) With both default and platform values, matching platforms use their value and others use default.
; 5) For a custom simplified key, set None in binary_simplified_key_mode.ini and let opc and FE select the mode.
; 6) ascendc_config.json determines which operators and platforms use AscendC.
[HyperMegaMoe]
default=0
