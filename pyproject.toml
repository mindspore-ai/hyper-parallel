[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper_parallel"
requires-python = ">=3.10,<3.13"
# setuptools reads the remaining package metadata and requirements.txt via setup.py.
dynamic = [
    "version", "description", "readme", "license", "authors", "keywords",
    "classifiers", "urls", "dependencies",
]

[project.optional-dependencies]
gpu = ["torch==2.9.1"]
# Match the OmegaConf range supported by VeRL's Hydra dependency.
verl = ["omegaconf>=2.2,<2.4"]
torch-npu-2-9 = [
    "torch==2.9.0",
    "torchvision==0.24.0+cpu; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.24.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "torch-npu==2.9.0.post9; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "hyper-multicore==0.1.0.dev0; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
]
torch-npu-2-10 = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torch-npu==2.10.0.post7; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "hyper-multicore==0.1.0.dev0; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
]
torch-npu-2-11 = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torch-npu==2.11.0.post3; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "hyper-multicore==0.1.0.dev0; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
]
torch-npu-2-12 = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    "torch-npu==2.12.0.post3; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "hyper-multicore==0.1.0.dev0; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
]
torch-npu-2-13 = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torch-npu==2.13.0; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "hyper-multicore==0.1.0.dev0; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
]
torch-npu-2-14 = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "torch-npu==2.14.0; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "hyper-multicore==0.1.0.dev0; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
]

[dependency-groups]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "build" }]
test = [
    "pytest",
    "coverage==7.13.1",
    "diff-cover",
    "expecttest",
    "omegaconf",
    "matplotlib",
    "scipy",
    # The solver uses the PULP_CBC_CMD API removed in PuLP 4.
    "pulp>=3.3,<4",
    "Pillow",
    "aiohttp",
    "pandas",
    "pyarrow",
]
lint = ["pylint==3.3.7", "pre-commit", "lizard", "codespell"]
build = ["setuptools>=78.1.1", "wheel", "build", "pybind11>=2.12.0"]
smoke-test = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "build" },
    { include-group = "smoke-test-deps" },
]
smoke-test-deps = [
    "Flask==2.2.5",
    "paramiko==3.4.0",
    "scp==0.15.0",
    "addict==2.4.0",
    "ninja==1.11.1.3",
    "flask-restful==0.3.10",
    "flask-cors==4.0.0",
    "pytest-timeout==2.2.0",
]

[tool.uv]
required-version = ">=0.11.16,<0.12"
default-groups = []
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "requirements.txt" }]
# Select one device stack per environment.
conflicts = [
    [
        { extra = "gpu" }, { extra = "torch-npu-2-9" },
        { extra = "torch-npu-2-10" }, { extra = "torch-npu-2-11" }, { extra = "torch-npu-2-12" },
        { extra = "torch-npu-2-13" }, { extra = "torch-npu-2-14" },
    ],
]

[tool.uv.sources]
# NPU uses CPU wheels for PyTorch and torchvision.
torch = [
    { index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "torch-npu-2-9", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "torch-npu-2-10", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "torch-npu-2-11", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "torch-npu-2-12", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "torch-npu-2-13", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "torch-npu-2-14", marker = "sys_platform == 'linux'" },
]

torchvision = [
    { index = "pytorch-cpu", extra = "torch-npu-2-9", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "torch-npu-2-10", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "torch-npu-2-11", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "torch-npu-2-12", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "torch-npu-2-13", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "torch-npu-2-14", marker = "sys_platform == 'linux'" },
]

# Select the archived CPython wheel for each Ascend stack and host.
