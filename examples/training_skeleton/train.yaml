# End-to-end multi-card training skeleton example.
#
# This YAML exercises the full hyper_models training skeleton on multiple cards
# using the new _target_ / typed-config schema. It intentionally uses a tiny
# local GPT-2 model and dummy data; loss values are not meaningful.
#
# Run with:
#   torchrun --nproc_per_node=4 examples/training_skeleton/main.py \
#            examples/training_skeleton/train.yaml

model:
  _target_: hyper_parallel.trainer.config.ModelConfig
  name: tiny_gpt2
  weights_path: ./outputs/tiny_model
  tokenizer_path: ./outputs/tiny_model

optimizer:
  _target_: hyper_models.components.optim.AdamW.Config
  lr: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

lr_scheduler:
  _target_: hyper_models.components.optim.lr_scheduler.LRSchedulerConfig
  lr_warmup_steps: 1
  lr_decay_style: cosine
  min_lr: 0.0

loss:
  _target_: hyper_models.components.loss.LossConfig
  loss_aggregation: token_weighted

step_scheduler:
  _target_: hyper_models.components.training.step_scheduler.StepSchedulerConfig
  max_steps: 4
  num_train_epochs: 1
  local_batch_size: 1
  global_batch_size: 2
  ckpt_every_steps: 2
  log_remote_every_steps: 1
  val_every_steps: 2

checkpoint:
  _target_: hyper_models.components.checkpoint.config.CheckpointingConfig
  checkpoint_dir: ./outputs/training_skeleton/checkpoints
  restore_from: null
  save_consolidated: final

training:
  _target_: hyper_models.trainer.config.TrainingConfig
  seed: 42

accelerator:
  _target_: hyper_models.trainer.config.AcceleratorConfig
  # 4-GPU topology: 2-way tensor parallel + 2-way FSDP data parallel.
  # The product of all sizes must equal --nproc_per_node.
  dp_shard_size: 2
  dp_replicate_size: 1
  tp_size: 2
  cp_size: 1
  pp_size: 1
  ep_size: 1
