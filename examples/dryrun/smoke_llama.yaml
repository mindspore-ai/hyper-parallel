# Two-rank FSDP2 FakeTensor dry-run smoke test on a tiny Llama config.
model:
  _target_: hyper_parallel.models.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: outputs/dryrun/models/tiny_llama
  local_files_only: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
training: {train_iters: 1, global_batch_size: 2, micro_batch_size: 1, backend: hccl,
           init_device: meta, max_grad_norm: 1.0, seed: 1234}
accelerator: {tp_size: 1, cp_size: 1, ep_size: 1, pp_size: 1}
fsdp_config: {dp_shard_size: 2, edp_shard_size: 1, reshard_after_forward: true}
optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  adamw_config: {adamw_lr: 1.0e-4, adamw_weight_decay: 0.0, adamw_betas: [0.9, 0.999], adamw_eps: 1.0e-8}
dataset: {_target_: tests.fixtures.data.datasets.DummyDataset, model_assets: {chat_template: null, tokenizer: null},
          num_samples: 8, seq_len: 128, vocab_size: 1024}
dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn: {_target_: hyper_parallel.data.batching.build_online_text_collate_fn}
  get_batch: {_target_: hyper_parallel.data.batching.TextParallelBatch, source_type: online, attention_mode: dense}
  batch_size: 1
  drop_last: true
  use_background_prefetcher: false
checkpoint: {save_ckpt: false, checkpoint_dir: ./outputs/dryrun/smoke_llama/checkpoints}
dry_run:
  target_device: npu
  sequence_length: 128
  output_dir: ./outputs/dryrun/smoke_llama
  value_dependencies:
    rules: []
