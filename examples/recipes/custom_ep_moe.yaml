# 配方：自研 EP-aware MoE（模块 forward 内部自带 all-to-all，如预堆叠
# w1/w2/w3 专家权重 + 自研调度器）。
# 对应教程章节：components_distributed_tutorial.md §7.2
#
# 要点：模块 forward 自带全部并行逻辑 → 不需要注入任何 compute fn，
# 只需一条声明：region_dispatch: false —— 告诉框架"本模块 forward 不可
# dispatch（通信在 forward 内）"，validate 走 local-region 骨架黑盒
# （to_local → 模块自身 forward → 按声明重包）。这同时是解析链第二环
# （local_compute_fn 缺省时，region_dispatch=False 即"compute = 模块
# 自身 forward"）。

accelerator:
  tp_size: 2
  cp_size: 1
  ep_size: 2
  pp_size: 1
  sequence_parallel: true

plan_overrides:
  - match: "*.moe"    # 你的 EP-aware MoE 模块 FQN glob
    when: ep
    # 无 local_compute_fn —— 模块自身 forward 即区域计算
    region_dispatch: false   # forward 内含 a2a 通信，不可 dispatch
    # 专家参数切分通常在 merge 模式下继承模板推导；自研命名未被模板
    # 识别时，需补 params 声明（insert 模式要求完整自声明）：
    # params:
    #   w1: {ep: "shard(0)"}
    #   w2: {ep: "shard(0)"}
    #   w3: {ep: "shard(0)"}
