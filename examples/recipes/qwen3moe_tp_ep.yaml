# 配方：HF 原生 MoE（Qwen3-MoE 系：gate + 循环 experts + 可选
# shared_experts）TP + EP（D-10 TP-extend-EP：无独立 ep 轴，EP 组从
# dp×tp×cp 稠密区延展）。
# 对应可跑示例：examples/distributed/ep.py / tp_cp_ep.py
#
# 要点：planner 自动识别 HF 原生 MoE 并切 expert 参数（{ep: shard(0)}），
# 但 EP compute（token all-to-all + 专家计算 + 结果回收）必须显式注入 —
# 仓内内置 archetype 工厂覆盖典型 MoE 行为（完整语义：router /
# shared expert / gate / merge 全部内聚，按 ep_compute.py 模块 docstring 的
# archetype 表选择；选错会在 apply 期接口断言报错并列出模块实际子模块名）；
# 其内部含 all-to-all 通信 → region_dispatch: false。

accelerator:
  tp_size: 2
  cp_size: 1
  ep_size: 2          # TP-extend-EP：ep 组大小，从 dp×tp×cp 延展
  pp_size: 1
  sequence_parallel: true

plan_overrides:
  - match: "*.mlp"    # HF MoE 的 MoE 模块通常命名为 mlp；按实际 FQN 调整
    when: ep
    region_dispatch: false   # EP compute 内含 all-to-all，不可 dispatch
    local_compute_fn:
      _target_: hyper_models.components.distributed.ep_compute.qwen3moe_ep_compute_fn
      # Qwen3-MoE 对应 qwen3moe archetype（TopKRouter 路由内嵌）；其他模型按
      # ep_compute.py 的 archetype 表选择（Mixtral → routed_only，Qwen2-MoE →
      # qwen2moe，DeepSeek-V3/GLM-4-MoE → deepseekv3）；自定义路由的 MoE 写自己的
      # 工厂函数（体内引用 MOE_ROUTER_ADAPTERS 条目），在此指向它。
