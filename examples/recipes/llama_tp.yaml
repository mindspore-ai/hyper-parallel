# 配方：稠密 LLM（Llama / Qwen-dense 系）纯 TP(+SP)。
# 对应可跑示例：examples/distributed/tp.py
#
# 要点：纯 TP 不需要任何 plan_overrides —— planner 按模板自动推导
# attention/MLP 的列切/行切、layernorm 复制、embed/lm_head 切分与全部
# 边界通信（SP 下 all-gather / reduce-scatter 的插入位置）。本配方的
# plan_overrides 全部为【可选】性能/定制 patch，不需要可整段删除。

accelerator:
  tp_size: 2          # 按实际卡数调整
  cp_size: 1
  ep_size: 1
  pp_size: 1
  sequence_parallel: true   # 激活按 seq 维随 TP 切分（推荐）

# 【可选】性能替换：把 attention 换成融合 kernel（示例目标为教学占位，
# 真实使用指向你的 kernel 工厂）。注入物是纯标准算子（F.sdpa 系）→
# region_dispatch: true（validate 穿透注入函数、out_src 真校验）。
# 配套可跑示例：examples/distributed/perf_replacement.py + perf_replacement.yaml
# plan_overrides:
#   - match: "*.self_attn"
#     region_dispatch: true   # 纯 aten 算子，可 dispatch 穿透
#     local_compute_fn:
#       _target_: your_pkg.perf_kernels.flash_attention_factory
