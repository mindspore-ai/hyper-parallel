model:
  name: glm5
  weights_path: null
  tokenizer_path: null
  config_overrides:
    vocab_size: 154856
    hidden_size: 1024
    intermediate_size: 3072
    num_hidden_layers: 4
    num_dense_layers: 4
    num_attention_heads: 16
    num_key_value_heads: 4
    head_dim: 64
    max_position_embeddings: 131072

data:
  type: preset_pt
  train_path: /path/to/preset_batches.pt
  max_seq_len: 64
  shuffle: false
  num_workers: 0
  pin_memory: true

train:
  max_steps: 100
  num_train_epochs: 1
  global_batch_size: 4
  micro_batch_size: 1
  seed: 1234
  backend: torch
  init_device: meta

  accelerator:
    dp_shard: 1
    tp: 1
    cp: 1
    ep: 1
    comm_fusion: true

  optimizer:
    type: adamw
    lr: 1.0e-4
    lr_min: 0.0
    lr_decay_style: cosine
    lr_warmup_ratio: 0.1
    max_grad_norm: 1.0e9
    weight_decay: 0.0
    loss_aggregation: rank_average

  mixed_precision:
    enabled: true
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: bfloat16

  gradient_checkpointing:
    activation_checkpoint: full

  checkpoint:
    output_dir: outputs/glm5
    save_steps: 50
    save_hf_weights: false

  logging:
    log_steps: 1
    report_throughput: false

  debug:
    deterministic: true
