# Eight-rank VLM training; fixed batches, no packing.
# Vision: FSDP only. Decoder: FSDP + CP=2 (attention KV all-gather, GDN P2P) + EP=2.
model:
  _target_: hyper_parallel.models.HyperAutoModelForImageTextToText.from_pretrained
  pretrained_model_name_or_path: path/to/model_weights
  torch_dtype: bfloat16
  attn_implementation: sdpa
  force_hf: true

training:
  train_iters: 100
  train_samples: null
  global_batch_size: 8
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true

accelerator:
  tp_size: 1
  cp_size: 2
  ep_size: 2
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 8
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: bfloat16
  edp_shard_size: 4
  replicate_params: []
  root_wrap_modules:
    - model.language_model.embed_tokens
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

plan_overrides:
  - match: "*.linear_attn"
    module_type: transformers.models.qwen3_5_moe.modeling_qwen3_5_moe.Qwen3_5MoeGatedDeltaNet
    exact_type: true
    replace_module:
      _target_: hyper_parallel.components.modules.TritonGDN
  - match: "*.mlp.experts"
    module_type: transformers.models.qwen3_5_moe.modeling_qwen3_5_moe.Qwen3_5MoeExperts
    exact_type: true
    replace_module:
      _target_: hyper_parallel.components.modules.GroupedExperts
  - match: "*.mlp"
    when: ep
    module_type: transformers.models.qwen3_5_moe.modeling_qwen3_5_moe.Qwen3_5MoeSparseMoeBlock
    exact_type: true
    region_dispatch: false
    local_compute_fn:
      _target_: hyper_parallel.models.qwen3_5_moe.adapter.distributed.expert_parallel.qwen3_5_moe_ep_compute_fn
      use_grouped_gemm: true
  - match: "*.linear_attn"
    when: cp
    inner_target: self
    inner_wrapper:
      _target_: hyper_parallel.models.qwen3_5.adapter.distributed.context_parallel.qwen3_5_gdn_p2p_cp_wrapper
      backend: triton
      chunk_size: 64
    region_dispatch: false
  - match: "*.self_attn"
    when: cp
    inner_target: self
    inner_wrapper: sdpa_hf
    region_dispatch: false

mixed_precision:
  enabled: false
activation_checkpoint:
  mode: full
activation_swap: none
compile:
  enabled: false

dataset:
  _target_: hyper_parallel.data.omni.build_dataset.build_online_omni_mapping_dataset
  # JSON/JSONL messages with image paths, or Parquet messages + images[].bytes/path.
  data_path: /home/chaoran/datasets/llava_1k_en/messages.jsonl
  data_config: {}
  data_transform:
    _target_: hyper_parallel.data.omni.omni_transform.AutoProcessorTransform
    max_seq_len: 8192

dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.omni.collator.OmniCollator
  get_batch:
    _target_: hyper_parallel.models.qwen3_5_moe.vlm_cp.QwenVLMParallelBatch
    sequence_alignment: 128
  dataloader_type: cyclic
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

loss_fn:
  _target_: hyper_parallel.components.losses.ChunkedCausalLMLoss
  chunk_size: 1024

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  fp32_main_params: true
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.95]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 1.0e-5
    lr_warmup_steps: 0
    min_lr: 1.0e-6

checkpoint:
  save_ckpt: false
  save_hf_weights: false
  checkpoint_dir: ./outputs/qwen3_6_moe_vlm/p2p_kv_allgather/checkpoints
  restore_from: null

debug:
  check_nan_inf: false
profiling:
  enabled: false
