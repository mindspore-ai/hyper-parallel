# Eight-rank VLM training; fixed batches, no packing.
# Vision: FSDP only. Decoder: FSDP + Ulysses CP=2.
# Launch from the repository root with the NPU environment and editable install ready:
# torchrun --standalone --nproc_per_node=8 --module scripts.train_vl examples/qwen3_8/train_online_vlm.yaml
model:
  _target_: hyper_parallel.models.qwen3_5_moe.adapter.vlm.build_qwen_vlm
  pretrained_model_name_or_path: path/to/model_weights
  torch_dtype: bfloat16
  attn_implementation: sdpa
  force_hf: true

training:
  train_iters: 100
  train_samples: null
  global_batch_size: 8
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true

accelerator:
  tp_size: 1
  cp_size: 2
  ep_size: 1
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 8
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: bfloat16
  replicate_params: []
  root_wrap_modules:
    - model.language_model.embed_tokens
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

plan_overrides:
  - match: "model.language_model.layers.*.linear_attn"
    replace:
      kind: module
      source_type: transformers.models.qwen3_5.modeling_qwen3_5.Qwen3_5GatedDeltaNet
      exact_type: true
      implementation:
        _target_: hyper_parallel.components.modules.TritonGDN
  - match: "model.language_model.layers.*.linear_attn.forward"
    when: cp
    replace:
      kind: method
      implementation: hyper_parallel.distributed.context_parallel.wrappers.gdn_ulysses_cp_wrapper
  - match: "model.language_model.layers.*.self_attn.forward"
    when: cp
    replace:
      kind: method
      implementation: hyper_parallel.distributed.context_parallel.wrappers.sdpa_hf_ulysses_cp_wrapper

mixed_precision:
  enabled: false
activation_checkpoint:
  mode: full
activation_swap: none
compile:
  enabled: false

dataset:
  model_assets:
    _target_: hyper_parallel.data.omni.omni_transform.build_auto_processor
    pretrained_model_name_or_path: path/to/model_weights
  _target_: hyper_parallel.data.omni.build_dataset.build_online_omni_mapping_dataset
  # JSON/JSONL messages with image paths, or Parquet messages + images[].bytes/path.
  data_path: /home/chaoran/datasets/llava_1k_en/messages.jsonl
  data_config: {}
  data_transform:
    _target_: hyper_parallel.data.omni.omni_transform.AutoProcessorTransform
    max_seq_len: 8192

dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.batching.build_omni_collate_fn
  get_batch:
    _target_: hyper_parallel.models.qwen3_5_moe.vlm_cp.QwenVLMParallelBatch
    sequence_alignment: 128
  sampler_type: cyclic
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

loss_fn:
  _target_: hyper_parallel.components.losses.ChunkedCausalLMLoss
  chunk_size: 1024

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  fp32_main_params: true
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.95]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 1.0e-5
    lr_warmup_steps: 0
    min_lr: 1.0e-6

checkpoint:
  save_ckpt: false
  save_hf_weights: false
  checkpoint_dir: ./outputs/qwen3_8_vlm/checkpoints
  restore_from: null

debug:
  check_nan_inf: false
profiler:
  enable: false
