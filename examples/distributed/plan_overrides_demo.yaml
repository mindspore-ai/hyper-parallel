# plan_overrides 全场景示例（配套 plan_overrides_demo.py）。
# 核心规则一句话：「不写继承，写了照办」——未写字段继承模板推导，
# 写了的字段（含显式空 {}）以你写的为准。
plan_overrides:
  # ── 场景 1：merge + 注入字段 ─────────────────────────────────────────
  # 命中推导边界（merge）：只写 local_compute_fn，params/契约全部继承推导。
  # 性能 patch 语义（无 when → 总是应用）。
  - match: "*.self_attn"
    # 注入的必填伴生声明（无默认）：本注入物是纯标准算子（F.sdpa 融合
    # kernel，可 dispatch）→ true：validate 穿透注入函数、out_src 真校验
    region_dispatch: true
    local_compute_fn:
      _target_: perf_kernels.flash_attention_factory

  # ── 场景 2：merge + 契约字段覆盖（placement 字符串 DSL）─────────────
  # 字段粒度替换：写了 params → 整个 params 以声明为准（不逐 key 合并，
  # 丢推导参数会打 WARNING）。此处与模板推导同值——验证 DSL→merge 链路；
  # 改成别的分片即真实定制（如 {tp: "replicate"} 去切分）。
  - match: "*.mlp"
    params:
      gate_proj.weight: {tp: "shard(0)"}
      up_proj.weight: {tp: "shard(0)"}
      down_proj.weight: {tp: "shard(1)"}

  # ── 场景 3：merge + 显式空 {} ───────────────────────────────────────
  # params: {} = 显式"本边界不切参数"（纯 I/O 缝合公民，ViT 模式）。
  # 与不写（继承推导）语义严格区分；也可用哨兵 none（{} 的可读别名）/
  # auto（显式继承，与不写同义，自文档）。
  - match: "*.input_layernorm"
    params: {}

  # ── 场景 4：when 激活条件 ──────────────────────────────────────────
  # when: cp → cp_size>1 才应用；本例 cp=1 → 条目被跳过（INFO 日志可见），
  # 一份配置跨拓扑复用。与场景 1 同 match：若 cp>1，两条目逐字段合并
  # （local_compute_fn + inner_wrapper 同边界共存，两族正交）。
  - match: "*.self_attn"
    when: cp
    # sdpa_hf wrapper 内含 K/V all-gather 通信（不可 dispatch）→ false
    region_dispatch: false
    inner_target: "self"     # 与 inner_wrapper 成对显式声明（包装模块自身）
    inner_wrapper: sdpa_hf

  # ── 场景 5：insert（模板未命中的自研模块，完整自声明）─────────────
  # model.aux 不在任何模板的识别范围 → insert 模式：必须显式声明契约
  # （至少一项；全不写 fail-fast；哨兵在 insert 无意义会被拒）。
  # 契约驱动真实通信：SP 布局下入口 all-gather（Shard(1)→Replicate）、
  # 出口 scatter（Replicate→Shard(1)）。
  - match: "model.aux"
    params:
      weight: {tp: "replicate"}
    in_src: {hidden_states: {tp: "shard(1)"}}
    in_dst: {hidden_states: {tp: "replicate"}}
    out_src: {output: {tp: "replicate"}}
    out_dst: {output: {tp: "shard(1)"}}
