# 性能替换注入示例（inner_wrapper 通道）：把 attention 边界的 forward 替换为
# 用户高性能实现。与 perf_replacement.yaml（local_compute_fn 通道）对比：
#
# - local_compute_fn：工厂返回 compute_fn，在 local-region 骨架内执行——
#   参数解包/I/O 契约由骨架托管，kernel 只见本地张量（推荐：省心）；
# - inner_wrapper：原地替换 target.forward，无骨架托管——wrapper 自负
#   双模式容错（validate 下输入是 DTensor），换来的是可以包装 inner
#   子模块（inner_target 定位）、保留原 forward 引用做"织入"（如探针/
#   日志/通信注入）。inner-wrap 机制不限于 CP（声明即应用）。
#
# 注意：同一边界两通道同时声明会叠加（inner-wrap 先替换 forward，
# local_compute_fn 再在区域内被调用）——替换场景二选一即可。
plan_overrides:
  - match: "*.self_attn"
    inner_target: "self"        # 包装目标 = 边界模块自身（显式声明）
    # wrapper 只做算子替换（F.sdpa，可 dispatch）→ region_dispatch: true：
    # validate 下 dispatch 穿透 inner 区域，边界 out_src 真校验
    region_dispatch: true
    inner_wrapper:
      _target_: perf_kernels.flash_attention_wrapper
