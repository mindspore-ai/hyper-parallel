# 性能替换注入示例：把 planner 推导边界上的朴素实现替换为用户高性能 kernel。
#
# match 命中的是 planner 已推导的边界（merge 模式）——params 切分与 I/O
# 契约全部继承推导结果，YAML 只需声明 local_compute_fn 一个字段。
# _target_ 指向用户 kernel 模块中的工厂函数（须在 PYTHONPATH 上可 import）。
# 纯性能 patch 无并行语义要求，不需要 when 字段（when 缺省 = 总是应用）；
# CP/EP 必需注入应写 when: cp / when: ep（见 ep_compute/cp_wrappers 文档）。
#
# 也可以直接指向仓内内置 archetype 工厂，例如 EP 场景（Qwen3-MoE）：
#   - match: "*.mlp"
#     when: ep
#     local_compute_fn:
#       _target_: hyper_models.components.distributed.ep_compute.qwen3moe_ep_compute_fn
plan_overrides:
  # 朴素 eager attention（显式 S×S scores）→ F.sdpa 融合 kernel
  - match: "*.self_attn"
    # 注入物是纯标准算子（F.sdpa/线性层，可 dispatch）→ region_dispatch: true：
    # validate 下策略传播穿透注入函数，out_src 真校验（区域内不再黑盒）
    region_dispatch: true
    local_compute_fn:
      _target_: perf_kernels.flash_attention_factory
  # 分解 silu（sigmoid+mul 一串小 kernel）→ 融合 F.silu
  - match: "*.mlp"
    region_dispatch: true        # F.silu/mul/线性层均可 dispatch
    local_compute_fn:
      _target_: perf_kernels.fused_swiglu_factory
