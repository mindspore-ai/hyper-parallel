# DeepSeek-V3 Codegen demo converted from the VeOmni configs/text/deepseek.yaml
# example. The source recipe enables FSDP2 + EP=8 and keeps Ulysses disabled.

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 8
  pp_size: 1
  sequence_parallel: false
  loss_parallel: true

model:
  _target_: hyper_parallel.models._transformers.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: deepseek-ai/DeepSeek-V3
  # The remote-code implementation stores experts per-expert
  # (gate_proj/up_proj/down_proj), while the built-in spec shards the fused
  # gate_up_proj/down_proj; loading with remote code leaves the codegen param
  # plan referencing parameters the model does not have.
  trust_remote_code: false
  torch_dtype: bfloat16
  attn_implementation: eager
  local_files_only: true
  load_base_model: false
  force_hf: false

# VeOmni source mapping:
#   ulysses_size: 1 -> cp_size: 1
#   ep_size: 8 -> ep_size: 8
#   fsdp2 -> fsdp_config
#   gradient_checkpointing.enable -> activation_checkpoint.mode
#   moe_implementation: fused_triton -> current DeepSeek-V3 EP recipe
plan_overrides:
  - match: "*.mlp"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: hyper_parallel.distributed.expert_parallel.recipes.deepseekv3_ep_compute_fn

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 3.0e-4
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

training:
  train_iters: 1000
  train_samples: null
  eval_iters: 0
  global_batch_size: 32
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: false
  empty_cache_steps: 500

fsdp_config:
  dp_shard_size: 8
  edp_shard_size: 1
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

mixed_precision:
  enabled: true

activation_checkpoint:
  mode: full

dataset:
  model_assets:
    chat_template: null
    tokenizer:
      _target_: hyper_parallel.data.text.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: deepseek-ai/DeepSeek-V3
      trust_remote_code: true
      local_files_only: true
      use_fast: true

  data_transform:
    _target_: hyper_parallel.data.text.build_data_transform.build_llm_data_transform
    data_type: plaintext
    text_keys: text
    max_seq_len: 8192

  _target_: hyper_parallel.data.text.build_dataset.build_indexed_text_dataset
  data_path: null
  data_config:
    seq_length: 128
    split: "1, 0, 0"
    mock_data: true
    distributed_walk: true
    is_dataset_from_mr: false
    simple_blend: "no"
    data_lazy_load: true
    skip_data_check: true
    labels_are_shifted: true
    create_attention_mask_in_dataloader: false
    create_ltor_fields_in_dataloader: false

dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.batching.build_indexed_collate_fn
  get_batch:
    _target_: hyper_parallel.data.batching.ParallelBatch
    source_type: indexed
    attention_mode: dense
    cp_algorithm: ulysses
  dataloader_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: constant
  lr_config:
    lr: 3.0e-4
    lr_warmup_steps: 7
    min_lr: 3.0e-4

checkpoint:
  save_ckpt: true
  checkpoint_dir: deepseek_v3
  restore_from: null
  save_steps: 100

debug:
  check_nan_inf: false
  check_dataset: null

codegen: true
modeling_backend: gen
