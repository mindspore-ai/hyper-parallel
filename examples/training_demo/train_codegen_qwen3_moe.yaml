# Qwen3-30B-A3B codegen demo YAML — 与 train_parallel_offline.yaml 完全同构，
# 唯一差异是打开 codegen（codegen: true + modeling_backend: gen）。
#
# 控制臂（native）是 train_parallel_offline.yaml（modle, parallel, overrides,
# optimizer, dataset 全一致）。A/B 只差「并行策略是否由 codegen 生成 artifact
# 下沉」这一件事，因此跑了之后 loss / grad_norm 逐 step 对齐 native 参考即
# 证明 codegen 路径与原生 patch 训练结果一致（demo 验证成功判据）。

accelerator:
  tp_size: 2
  cp_size: 2
  ep_size: 2
  pp_size: 1
  sequence_parallel: true
  loss_parallel: true

model:
  _target_: hyper_parallel.models._transformers.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3-30B-A3B
  config_overrides:
    num_hidden_layers: 4
    use_cache: false
  torch_dtype: bfloat16
  attn_implementation: sdpa
  local_files_only: true
  load_base_model: false
  force_hf: false

plan_overrides:
  - match:
      - "*.input_layernorm"
      - "*.post_attention_layernorm"
      - "model.norm"
    module_type: transformers.models.qwen3_moe.modeling_qwen3_moe.Qwen3MoeRMSNorm
    replace_module:
      _target_: hyper_parallel.models.qwen3_moe.adapter.replacements.replace_qwen3_moe_rms_norm
  - match: "*.self_attn"
    module_type: transformers.models.qwen3_moe.modeling_qwen3_moe.Qwen3MoeAttention
    replace_module:
      _target_: hyper_parallel.models.qwen3_moe.adapter.replacements.replace_qwen3_moe_flash_attention
  - match: "*.mlp.experts"
    module_type: transformers.models.qwen3_moe.modeling_qwen3_moe.Qwen3MoeExperts
    replace_module:
      _target_: hyper_parallel.models.qwen3_moe.adapter.replacements.replace_qwen3_moe_grouped_experts
  - match: "*.self_attn"
    when: cp
    region_dispatch: false
    inner_target: self
    inner_wrapper:
      _target_: hyper_parallel.models.qwen3_moe.adapter.distributed.context_parallel.qwen3_moe_flash_attention_cp_wrapper
  - match: "*.mlp"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: hyper_parallel.models.qwen3_moe.adapter.distributed.expert_parallel.qwen3moe_ep_compute_fn
      use_grouped_gemm: true

optimizer:
  _target_: hyper_parallel.components.optim.Muon
  no_decay_params: [bias, norm, ln_]
  muon_config:
    muon_lr: 3.0e-5
    muon_weight_decay: 0.0
    muon_momentum: 0.95
    muon_nesterov: true
    muon_ns_steps: 5
    muon_ns_variant: asym5
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

training:
  train_iters: 10
  train_samples: null
  eval_iters: 0
  global_batch_size: 8
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true

fsdp_config:
  dp_shard_size: 2
  edp_shard_size: 2
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: off

dataset:
  model_assets:
    chat_template: null
    tokenizer:
      _target_: hyper_parallel.data.text.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: Qwen/Qwen3-30B-A3B
      local_files_only: true
      tokenizer_type: pretokenized
      vocab_size: 151936
      eod_token_id: 151645
  _target_: hyper_parallel.data.text.build_dataset.build_indexed_text_dataset
  data_path: ./output/training_demo/data/parallel_offline_text_document
  data_config:
    seq_length: 128
    split: "1, 0, 0"
    mock_data: false
    distributed_walk: true
    is_dataset_from_mr: false
    simple_blend: "no"
    data_lazy_load: true
    skip_data_check: true
    labels_are_shifted: true
    create_attention_mask_in_dataloader: false
    create_ltor_fields_in_dataloader: false

dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.batching.build_indexed_collate_fn
  get_batch:
    _target_: hyper_parallel.data.batching.ParallelBatch
    source_type: indexed
    attention_mode: dense
    cp_algorithm: ulysses
  dataloader_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ""
  restore_from: null

debug:
  check_nan_inf: false
  check_dataset: null

# codegen 控制字段：与 native 臂（train_parallel_offline.yaml）唯一的差异点。
codegen: true
modeling_backend: gen
