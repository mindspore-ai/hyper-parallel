# Online Hugging Face conversational Dataset demo for Qwen3.5-0.8B.
#
# UltraChat messages are rendered with the tokenizer's native chat template.
# Run with: bash examples/training_demo/run_online_ultrachat.sh

model:
  _target_: hyper_models._transformers.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: ./qwen3.5-0.8B
  torch_dtype: bfloat16
  attn_implementation: sdpa
  force_hf: true

training:
  train_steps: 10
  eval_iters: 1
  train_samples: null
  num_train_epochs: 1
  global_batch_size: 8
  micro_batch_size: 1
  backend: nccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: false

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 1
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 8
  replicate_params: []
  reshard_after_forward: true
  defer_fsdp_grad_sync: true
  comm_fusion: true

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: off

dataset:
  model_assets:
    datasets_type: conversation
    chat_template:
      _target_: hyper_models.components.datasets.llm.chat_template.ChatmlTemplate
    tokenizer:
      _target_: hyper_models.components.datasets.llm.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: ./qwen3.5-0.8B
      use_fast: true
      trust_remote_code: true
  data_transform:
    _target_: hyper_models.components.datasets.llm.build_data_transform.build_llm_data_transform
    data_type: conversation
    text_keys: messages
    max_seq_len: 2048
  _target_: hyper_models.components.datasets.llm.build_llm_dataset
  # Kept for the common Dataset target contract. hf_dataset_name selects the
  # Hub source, so this value is not interpreted as a local path.
  data_path: HuggingFaceH4/ultrachat_200k
  data_config:
    source_type: online
    dataset_type: mapping
    hf_dataset_name: HuggingFaceH4/ultrachat_200k
    hf_config_name: default
    namespace: train_sft
    cache_dir: null
    show_progress: true

dataloader:
  # StatefulDataLoader adapter; use dataloader_type instead of shuffle.
  _target_: hyper_models.components.datasets.DataLoader
  collate_fn:
    _target_: hyper_models.components.datasets.llm.build_llm_collator
    packing: false
  get_batch:
    _target_: hyper_models.components.datasets.llm.build_llm_get_batch
  dataloader_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

optimizer:
  _target_: hyper_models.components.optim.optimizer.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.95]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_models.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  enabled: false
  checkpoint_dir: ./outputs/training_demo/online_ultrachat_checkpoints

debug:
  check_nan_inf: false
