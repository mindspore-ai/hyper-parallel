# Pure AdamW self-validation configuration.

model:
  _target_: hyper_models._transformers.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: ./outputs/training_demo/tiny_llama
  torch_dtype: auto
  attn_implementation: sdpa
  force_hf: true

training:
  train_steps: 2
  eval_iters: 0
  num_train_epochs: 1
  global_batch_size: 2
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: false

accelerator:
  tp_size: 2
  cp_size: 1
  ep_size: 1
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 2
  replicate_params: []
  reshard_after_forward: true
  defer_fsdp_grad_sync: true

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: off

dataset:
  data_transform:
    _target_: hyper_models.components.data.identity_transform.IdentityDataTransform
  _target_: hyper_models.components.data.datasets.DummyDataset
  num_samples: 32
  seq_len: 32
  vocab_size: 1000
  seed: 42

dataloader:
  _target_: hyper_models.components.data.dataloader.DataLoader
  collate_fn:
    _target_: hyper_models.components.datasets.llm.build_llm_collator
    packing: false
  get_batch:
    _target_: hyper_models.components.datasets.llm.build_llm_get_batch
  shuffle: true
  drop_last: true
  use_background_prefetcher: false

optimizer:
  _target_: hyper_models.components.optim.optimizer.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-4
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_models.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  enabled: false
  checkpoint_dir: ./outputs/training_demo/checkpoints

debug:
  check_nan_inf: false
