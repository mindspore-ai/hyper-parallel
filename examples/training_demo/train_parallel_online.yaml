# TP×CP×EP×FSDP training with Online WikiText tokenization and packing.

model:
  _target_: hyper_parallel.auto_models._transformers.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: PrimeIntellect/qwen3-moe-tiny
  torch_dtype: bfloat16
  attn_implementation: sdpa
  force_hf: true

training:
  train_iters: 10
  train_samples: null
  eval_iters: 0

  global_batch_size: 4
  micro_batch_size: 1

  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true

accelerator:
  tp_size: 2
  cp_size: 2
  ep_size: 2
  pp_size: 1
  sequence_parallel: true
  loss_parallel: false

fsdp_config:
  dp_shard_size: 2
  edp_shard_size: 2
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

plan_overrides:
  - match:
      - "*.input_layernorm"
      - "*.post_attention_layernorm"
      - "model.norm"
    module_type: transformers.models.qwen3_moe.modeling_qwen3_moe.Qwen3MoeRMSNorm
    replace_module:
      _target_: hyper_parallel.auto_models.components.models.qwen3_moe_fusions.replace_qwen3_moe_rms_norm
  - match: "*.self_attn"
    when: cp
    region_dispatch: false
    inner_target: self
    inner_wrapper:
      _target_: hyper_parallel.auto_models.components.distributed.cp_wrappers.sdpa_hf_ulysses_cp_wrapper
  - match: "model.layers.[!0]*.mlp"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: hyper_parallel.auto_models.components.distributed.ep_compute.qwen3moe_ep_compute_fn
      use_grouped_gemm: true

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: off

dataset:
  model_assets:
    chat_template: null
    tokenizer:
      _target_: hyper_parallel.auto_models.components.datasets.llm.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: PrimeIntellect/qwen3-moe-tiny
      use_fast: true

  data_transform:
    _target_: hyper_parallel.auto_models.components.datasets.llm.build_data_transform.build_llm_data_transform
    data_type: plaintext
    text_keys: text
    max_seq_len: 4096

  _target_: hyper_parallel.auto_models.components.datasets.llm.build_online_text_dataset
  data_path: ./outputs/training_demo/tiny_qwen3_moe_wikitext2/raw/wikitext-2-raw-v1-train.jsonl
  data_config:
    dataset_type: mapping
    hf_dataset_name: null

dataloader:
  _target_: hyper_parallel.auto_models.components.datasets.DynamicBatchDataLoader

  # Buffer short Online samples before selecting a token-budgeted FB batch.
  # The 4096-token budget is derived from micro_batch_size * max_seq_len.
  min_buffered_samples: 200

  # Pack the dynamically selected K samples and emit their sequence boundaries.
  collate_fn:
    _target_: hyper_parallel.auto_models.components.datasets.build_online_text_collate_fn

  get_batch:
    _target_: hyper_parallel.auto_models.components.datasets.ParallelBatch
    source_type: online
    attention_mode: dense

  dataloader_type: cyclic

  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

optimizer:
  _target_: hyper_parallel.auto_models.components.optim.optimizer.Muon
  no_decay_params: [bias, norm, ln_]
  muon_config:
    muon_lr: 2.0e-2
    muon_weight_decay: 0.1
    muon_momentum: 0.95
    muon_nesterov: true
    muon_ns_steps: 5
    muon_ns_variant: asym5
  adamw_config:
    adamw_lr: 1.0e-4
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.95]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.auto_models.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ""
  restore_from: null

debug:
  check_nan_inf: false
  check_dataset: 
