# Local Online Dataset demo for Instruction/Alpaca JSONL records.
# The transform renders each record with text_template before tokenization.

model:
  _target_: hyper_parallel.auto_models._transformers.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: ./qwen3.5-0.8B
  torch_dtype: bfloat16
  attn_implementation: sdpa
  force_hf: true

training:
  train_iters: 2
  train_samples: null
  eval_iters: 0
  global_batch_size: 2
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 1
  pp_size: 1

fsdp_config:
  dp_shard_size: 2

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: off

dataset:
  model_assets:
    chat_template: null
    tokenizer:
      _target_: hyper_parallel.auto_models.components.datasets.llm.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: ./qwen3.5-0.8B
      use_fast: true
      trust_remote_code: true
  data_transform:
    _target_: hyper_parallel.auto_models.components.datasets.llm.build_data_transform.build_llm_data_transform
    data_type: plaintext
    text_template: "Instruction: {instruction}\nInput: {input}\nOutput: {output}"
    max_seq_len: 512
  _target_: hyper_parallel.auto_models.components.datasets.llm.build_online_text_dataset
  data_path: examples/training_demo/data/instruction_demo.jsonl
  data_config:
    dataset_type: mapping
    hf_dataset_name: null

dataloader:
  _target_: hyper_parallel.auto_models.components.datasets.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.auto_models.components.datasets.build_online_text_collate_fn
  get_batch:
    _target_: hyper_parallel.auto_models.components.datasets.ParallelBatch
    source_type: online
  dataloader_type: cyclic
  drop_last: true
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

optimizer:
  _target_: hyper_parallel.auto_models.components.optim.optimizer.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.95]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.auto_models.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false

debug:
  check_nan_inf: false
  check_dataset: debug
