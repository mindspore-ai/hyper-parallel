# Trainer end-to-end demo.
#
# This example loads Qwen3-30B-A3B and the WikiText-2 raw training split from
# Hugging Face Hub to validate the full Trainer path with real text data.
#
# Run on eight Ascend NPUs with:
#   bash examples/training_demo/run.sh

model:
  _target_: hyper_models._transformers.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: "Qwen/Qwen3-30B-A3B" # tiny-random-LlamaForCausalLMB #
  ignore_mismatched_sizes: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  force_hf: true

training:
  train_iters: 25
  train_samples: null

  global_batch_size: 8
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true # false

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 1
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 16
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: false
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

plan_overrides:
  - match:
      - "*.input_layernorm"
      - "*.post_attention_layernorm"
      - "model.norm"
    module_type: transformers.models.qwen3_moe.modeling_qwen3_moe.Qwen3MoeRMSNorm
    replace_module:
      _target_: hyper_models.components.models.qwen3_moe_fusions.replace_qwen3_moe_rms_norm
  - match: "*.self_attn"
    module_type: transformers.models.qwen3_moe.modeling_qwen3_moe.Qwen3MoeAttention
    replace_module:
      _target_: hyper_models.components.models.qwen3_moe_fusions.replace_qwen3_moe_flash_attention
  - match: "*.mlp"
    module_type: transformers.models.qwen3_moe.modeling_qwen3_moe.Qwen3MoeSparseMoeBlock
    replace_module:
      _target_: examples.distributed.perf_kernels.NpuGroupedMoe

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: full

activation_swap: none # attention, none

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

# Minimal WikiText-2 path: tokenize raw text, concatenate documents with EOS,
# and group tokens into fixed 4096-token samples. The transform deliberately
# emits labels identical to input_ids; causal label shifting is model-owned.
dataset:
  model_assets:
    datasets_type: plaintext
    chat_template: null
    tokenizer:
      _target_: hyper_models.components.datasets.llm.build_tokenizer.AutoTokenizer.from_pretrained
      use_fast: true
      trust_remote_code: true

  data_transform:
    _target_: examples.training_demo.data.PlainTextDataTransform
    text_column: text
    seq_len: 4096
    append_eos: true

  data_config:
    create_attention_mask_in_dataloader: false

  _target_: examples.training_demo.data.load_tokenized_text_dataset
  path: Salesforce/wikitext
  name: wikitext-2-raw-v1
  split: train

dataloader:
  # StatefulDataLoader adapter; sampling order is controlled by dataloader_type,
  # so do not configure torch DataLoader's shuffle option here.
  _target_: hyper_models.components.datasets.DataLoader

  collate_fn:
    _target_: hyper_models.components.datasets.llm.build_llm_collator
    packing: false

  get_batch:
    _target_: hyper_models.components.datasets.llm.build_llm_get_batch

  # single: sequential/rearranged; cyclic: deterministic shuffled epochs.
  dataloader_type: single # cyclic

  # Defaults.
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

optimizer:
  _target_: hyper_models.components.optim.optimizer.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.95]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_models.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 0
    min_lr: 1.0e-6

checkpoint:
  # Gates saving only; loading is controlled by restore_from below, so
  # save_ckpt=false with a restore_from set means "start here, write nothing".
  save_ckpt: true
  checkpoint_dir: ./outputs/training_demo/checkpoints
  save_steps: 10
  save_epochs: 1
  is_async: false
  save_optimizer: true
  save_train_state: true
  # Where the per-step training state (step/epoch, lr_scheduler, dataloader
  # position, RNG) is written.
  #   true  - one torch.save file per rank under extra_state/. Always correct.
  #   false - embedded in the DCP state dict; fewer files, but DCP deduplicates
  #           entries sharing an FQN across ranks, so it is only valid when that
  #           state is identical on every rank. Restore auto-detects either
  #           layout, so this can be flipped between runs.
  save_extra_state_per_rank: false

  # Resume with:  bash examples/training_demo/run.sh --checkpoint.restore_from=LATEST
  # or point at one directory: --checkpoint.restore_from=./outputs/training_demo/checkpoints/global_step_10
  restore_from: LATEST
  restore_optimizer: true
  restore_train_state: true

debug:
  check_nan_inf: false
  check_dataset: false

profiling:
  enabled: false
  start_step: 3
  end_step: 4
  trace_dir: ./outputs/training_demo/profiling
  record_shapes: false
  profile_memory: false
  with_stack: false
  with_modules: false
  rank: 0
