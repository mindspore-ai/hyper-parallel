# Trainer end-to-end demo.
#
# This example intentionally uses a generated tiny Llama checkpoint and dummy
# token IDs. It validates Trainer component construction and the optimizer
# loop; it is not a meaningful language-model training workload.
#
# Run on four Ascend NPUs with:
#   bash examples/training_demo/run.sh

model:
  _target_: hyper_models._transformers.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: ./outputs/training_demo/tiny_llama
  torch_dtype: auto
  attn_implementation: sdpa
  force_hf: true

training:
  max_steps: null
  num_train_epochs: 1
  global_batch_size: 16
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: false

accelerator:
  tp_size: 2
  cp_size: 1
  ep_size: 1
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 2
  replicate_params: []
  reshard_after_forward: true
  defer_fsdp_grad_sync: true

# plan_overrides: ShardingPlanner 唯一 override 接口的 YAML 形态（注入字段 +
# 契约 DSL + when 条件）。CP/EP compute 注入在 cp_size>1 / ep_size>1 时是必需
# 的——框架不再自动注入内置实现，缺失时 apply 前 fail-fast（报错附可粘贴片段）。
# when 字段自述必要性：when: cp 表示 cp_size>1 时才应用（cp=1 的单卡调试可
# 复用同一份配置，entry 自动跳过并打日志）；缺省 = 总是应用（性能 patch）。
# plan_overrides:
#   # region_dispatch 是注入的必填伴生声明（无默认）：注入物含通信原语/
#   # 自定义 kernel（CP K/V all-gather、EP all-to-all、量化 GEMM）→ false
#   # （骨架/适配器黑盒托管）；注入物是纯标准算子（融合 kernel/写法优化）
#   # → true（validate 下 dispatch 穿透注入函数，out_src 真校验）。
#   # CP: HF-style attention (forward(hidden_states) with F.sdpa inside).
#   # Use sdpa_qkv_cp_wrapper for NeMo-style forward(q, k, v), or a
#   # INNER_WRAPPER_REGISTRY name in plain string form: inner_wrapper: sdpa_hf
#   - match: "*.self_attn"
#     when: cp
#     region_dispatch: false   # wrapper 内含 K/V all-gather 通信，不可 dispatch
#     inner_wrapper:
#       _target_: hyper_models.components.distributed.cp_wrappers.sdpa_hf_cp_wrapper
#   # EP: HF-native MoE — the shipped TP-extend-EP reference implementation
#   # (routing is embedded in the factory: _softmax_topk_router; a MoE with
#   # different routing writes its own factory referencing MOE_ROUTER_ADAPTERS
#   # entries by name). A custom EP-aware module whose forward already
#   # carries the all-to-all declares `region_dispatch: false` alone (no
#   # local_compute_fn — the module's own forward IS the region compute).
#   - match: "*.mlp"
#     when: ep
#     region_dispatch: false   # EP compute 内含 all-to-all，不可 dispatch
#     local_compute_fn:
#       _target_: hyper_models.components.distributed.ep_compute.hf_native_ep_compute_fn
#   # 契约字段（高级用法，merge 缺省继承推导）：placement 字符串 DSL
#   # "replicate"/"partial"/"shard(N)"，哨兵 "auto"（显式继承）/"none"（显式清空）：
#   # - match: "*.mlp"
#   #   params: {gate_proj.weight: {tp: "shard(0)"}}
#   #   in_dst: {hidden_states: {tp: "replicate"}}
#   #   out_src: {tp: "partial"}        # 标量简写 = {output: {...}}

mixed_precision:
  enabled: false

gradient_checkpointing:
  activation_checkpoint: off

data_transform:
  _target_: hyper_models.components.data.identity_transform.IdentityDataTransform

dataset:
  _target_: hyper_models.components.data.datasets.DummyDataset
  num_samples: 400
  seq_len: 32
  vocab_size: 1000
  seed: 42

collate_fn:
  _target_: hyper_models.components.data.data_collator.MakeMicroBatchCollator

dataloader:
  _target_: hyper_models.components.data.dataloader.DataLoader
  shuffle: true
  drop_last: true
  use_background_prefetcher: false

optimizer:
  _target_: hyper_models.components.optim.optimizer.optimizer.AdamW
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  foreach: false

lr_scheduler:
  _target_: hyper_models.components.optim.lr_scheduler.lr_scheduler.cosine_with_warmup
  lr_warmup_steps: 1
  min_lr: 0.0

checkpoint:
  enabled: false
  checkpoint_dir: ./outputs/training_demo/checkpoints

debug:
  check_nan_inf: false
