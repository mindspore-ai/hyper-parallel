# Trainer end-to-end demo.
#
# This example loads the pretrained Qwen3-30B-A3B checkpoint from Hugging Face
# Hub and uses tokenized WikiText-2 data to validate the full Trainer path.
#
# Run on eight Ascend NPUs with:
#   bash examples/training_demo/run.sh

model:
  _target_: hyper_models._transformers.HyperAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: "Qwen/Qwen3-30B-A3B" # tiny-random-LlamaForCausalLMB # 
  ignore_mismatched_sizes: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  force_hf: true

# tokenizer:
#   _target_: transformers.AutoTokenizer.from_pretrained
#   pretrained_model_name_or_path: ./outputs/training_demo/qwen3_30b_a3b
#   use_fast: true

training:
  train_steps: 5
  train_samples: null
  num_train_epochs: 1

  global_batch_size: 8
  micro_batch_size: 1

  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true # false

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 1
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 8
  replicate_params: []
  reshard_after_forward: true
  defer_fsdp_grad_sync: true
  comm_fusion: false

# plan_overrides: ShardingPlanner 唯一 override 接口的 YAML 形态（注入字段 +
# 契约 DSL + when 条件）。CP/EP compute 注入在 cp_size>1 / ep_size>1 时是必需
# 的——框架不再自动注入内置实现，缺失时 apply 前 fail-fast（报错附可粘贴片段）。
# when 字段自述必要性：when: cp 表示 cp_size>1 时才应用（cp=1 的单卡调试可
# 复用同一份配置，entry 自动跳过并打日志）；缺省 = 总是应用（性能 patch）。
# plan_overrides:
#   # region_dispatch 是注入的必填伴生声明（无默认）：注入物含通信原语/
#   # 自定义 kernel（CP K/V all-gather、EP all-to-all、量化 GEMM）→ false
#   # （骨架/适配器黑盒托管）；注入物是纯标准算子（融合 kernel/写法优化）
#   # → true（validate 下 dispatch 穿透注入函数，out_src 真校验）。
#   # CP: HF-style attention (forward(hidden_states) with F.sdpa inside).
#   # Use sdpa_qkv_cp_wrapper for NeMo-style forward(q, k, v), or a
#   # INNER_WRAPPER_REGISTRY name in plain string form: inner_wrapper: sdpa_hf
#   - match: "*.self_attn"
#     when: cp
#     region_dispatch: false   # wrapper 内含 K/V all-gather 通信，不可 dispatch
#     inner_wrapper:
#       _target_: hyper_models.components.distributed.cp_wrappers.sdpa_hf_cp_wrapper
#   # EP: HF-native MoE — shipped archetype factories (complete semantics:
#   # router / shared expert / gate / merge all inside, explicitly chosen per
#   # the archetype table in ep_compute.py; a wrong choice fails at apply time
#   # with an interface assertion listing the module's actual children). A
#   # custom EP-aware module whose forward already carries the all-to-all
#   # declares `region_dispatch: false` alone (no local_compute_fn — the
#   # module's own forward IS the region compute).
#   - match: "*.mlp"
#     when: ep
#     region_dispatch: false   # EP compute 内含 all-to-all，不可 dispatch
#     local_compute_fn:
#       _target_: hyper_models.components.distributed.ep_compute.qwen3moe_ep_compute_fn
#   # 契约字段（高级用法，merge 缺省继承推导）：placement 字符串 DSL
#   # "replicate"/"partial"/"shard(N)"，哨兵 "auto"（显式继承）/"none"（显式清空）：
#   # - match: "*.mlp"
#   #   params: {gate_proj.weight: {tp: "shard(0)"}}
#   #   in_dst: {hidden_states: {tp: "replicate"}}
#   #   out_src: {tp: "partial"}        # 标量简写 = {output: {...}}

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: off # off, full, selective

activation_swap: none # attention, none

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

# Megatron indexed Dataset. data_path is the shared .bin/.idx prefix; the
# provider builds train/validation/test together from the configured split.
dataset:
  model_assets:
    datasets_type: pretokenized
    chat_template: null
    tokenizer:

  data_transform:
    _target_: hyper_models.components.datasets.llm.build_data_transform.build_llm_data_transform
    data_type: pretokenized
    max_seq_len: 4096 #64

  _target_: hyper_models.components.datasets.llm.build_llm_dataset
  data_path:
  data_config:
    source_type: offline
    seq_length: 4096 #64
    split: "1, 0.0, 0.00"  # train, validation, test

    # Indexed-Dataset reader and sample-index options.
    mock_data: True # false
    distributed_walk: true
    is_dataset_from_mr: false # true #
    simple_blend: 'no' # inter #
    data_lazy_load: true
    skip_data_check: true

dataloader:
  # StatefulDataLoader adapter; sampling order is controlled by dataloader_type,
  # so do not configure torch DataLoader's shuffle option here.
  _target_: hyper_models.components.datasets.DataLoader

  collate_fn:
    _target_: hyper_models.components.datasets.llm.build_llm_collator
    packing: false

  get_batch:
    _target_: hyper_models.components.datasets.llm.build_llm_get_batch

  # single: sequential/rearranged; cyclic: deterministic shuffled epochs.
  dataloader_type: single # cyclic # 

  # Defaults.
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

optimizer:
  _target_: hyper_models.components.optim.optimizer.Muon
  extra_adamw_name_keywords: []
  no_decay_params: #[bias, norm, ln_]
  muon_config:
    muon_lr: 1.0e-2
    muon_weight_decay: 0.0
    muon_momentum: 0.95
    muon_nesterov: true
    muon_ns_steps: 5
    muon_ns_variant: asym5
  adamw_config:
    adamw_lr: 1.0e-3
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_models.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  enabled: false
  checkpoint_dir: '' #./outputs/training_demo/checkpoints

debug:
  check_nan_inf: false
  check_dataset: false
