limitations:
  - Online data is functional smoke evidence, not formal precision acceptance.
  - No checkpoint tensors were downloaded, converted, or loaded.
  - Vision, DSpark, later source groups, PP-stage shadow indexers, and the second Engram layer are cropped out.
  - V4.1 does not publish the production Indexer loss coefficient; the smoke value is validation-only.
  - Runtime KV cache and SWA bounded replay are inference or rollout concerns, not this full-sequence training forward.
  - Main-KV E2M1 and Indexer-QK MXFP4 QAT are required for formal post-training fidelity but are not implemented.
