mixed_precision:
  enabled: false

activation_checkpoint:
  mode: full

activation_swap: none

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

dataset:
  _target_: hyper_parallel.data.vlm.build_vlm_dataset
  data_config:
    source_type: online
  data_path: /path/to/kimi_vlm_data.json
  data_transform:
    _target_: hyper_parallel.data.vlm.kimi_transform.build_kimi_vlm_data_transform
    max_seq_len: 2048

dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.vlm.collator.build_vlm_collator
  dataloader_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

optimizer:
  _target_: hyper_parallel.components.optim.builders.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ""
  restore_from: null

debug:
  check_nan_inf: true
  check_dataset: null

profiling:
  enabled: false
  start_step: 3
  end_step: 5
  trace_dir: ./outputs/profiling
  record_shapes: false
  profile_memory: false
  with_stack: false
  with_modules: false
  rank: 0
