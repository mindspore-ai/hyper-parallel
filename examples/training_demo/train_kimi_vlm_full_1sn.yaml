# Kimi-K2.5/K2.6 full-scale VLM config: 61-layer text tower (384 experts) plus
# the full 27-layer vision tower, on ONE 16-node super-node (128 devices).
#
# Why this differs from the cropped demo (train_kimi_vlm.yaml):
#   * enable_offload is REQUIRED -- a 1T-parameter model does not fit the pure
#     NPU resident set (params + grads + bf16 optimizer state) on 128 devices;
#   * max_seq_len is capped at 2048 -- seq 4096 OOMs on the first step;
#   * plan_overrides carries explicit vision-tower leaf specs (see the note next
#     to them) because the vision tower is replicated rather than TP-sharded and
#     the planner cannot infer those boundaries. Glob keys do NOT work here.
#
# Data: multimodal content-list conversations (see the VLM demo in README.md);
# needs at least `global_batch_size` samples.
#
# Run: start scripts/train_vl.py with this YAML on a 16-node job, e.g.
#   torchrun --nproc_per_node=8 --nnodes=16 --node_rank=<i> \
#     --master_addr=<node0-ip> --master_port=29581 \
#     scripts/train_vl.py examples/training_demo/train_kimi_vlm_full_1sn.yaml

model:
  _target_: examples.training_demo.cropped_kimi_vlm.build_cropped_kimi_vlm
  pretrained_model_name_or_path: /path/to/Kimi-K2.6
  config_path: /path/to/Kimi-K2.6
  num_hidden_layers: 61
  n_routed_experts: 384
  trust_remote_code: false          # processor 走 native（image_grid_thw 协议）
  local_files_only: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  validate_placement: false

training:
  train_iters: 3
  train_samples: null
  eval_iters: 0

  global_batch_size: 128
  micro_batch_size: 1

  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 128
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 128
  edp_shard_size: 1
  enable_offload: true
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: false
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

plan_overrides:
  # The nested TEXT tower's MoE layers use the EP compute path (the dense layer 0
  # is excluded by the leading [123456789]).
  #
  # The vision-tower leaf specs below are required whenever ep_size >= 1. The
  # vision tower is replicated instead of TP-sharded (its native attention
  # reshapes heads on the full hidden dim), and whole-tower replication makes
  # the planner's role-based boundary inference miss these parameters; explicit
  # per-leaf specs therefore carry the coverage/owner contract. A compressed
  # glob form cannot replace them: glob keys merge into existing boundaries
  # only and never insert new ones, so the glob variant fails the coverage
  # check with 324 uncovered parameters (=162 submodules x weight+bias).
  - match: "model.language_model.layers.[123456789]*.mlp"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: hyper_parallel.distributed.expert_parallel.recipes.deepseekv3_ep_compute_fn

  - match: model.vision_tower.layers.0.attn.q_proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.0.attn.k_proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.0.attn.v_proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.0.attn.proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.0.mlp.fc1
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.0.mlp.fc2
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.1.attn.q_proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.1.attn.k_proj
