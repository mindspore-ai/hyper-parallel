# DeepSeek-V4.1 cropped validation: native arm, 8 NPUs (ep8 + fsdp8).
# Derived from examples/training_demo/deepseek_v41/train_deepseek_v41_online.yaml
# (16-card design): ep16/fsdp16 -> ep8/fsdp8, host asset paths, 10 iters.
# seq len 4096 -> 1024: without the omni NPU kernel a validation host runs
# the reference sparse attention, which materializes [B,H,S,K] activations
# per layer; at 4K the 40-layer saved-activation baseline alone exceeds 60GB.
# Placeholders (__DSV41_CONFIG__, __VAL_ROOT__) are rendered by
# run_codegen_validation.sh; the codegen arm is derived by appending
# `codegen: true` so the two arms differ by that field only.
model:
  _target_: hyper_parallel.models.deepseek_v41.adapter.validation.cropped_model.build_cropped_deepseek_v41
  config_path: __DSV41_CONFIG__
  engram_assets_path: __VAL_ROOT__/data/engram_depth_preserving_d8.json
  text_parameter_divisor: 8
  num_routed_experts: 16
  exercise_post_training_indexer: true
  indexer_loss_coeff: 0.001
  torch_dtype: bfloat16
  validate_placement: false

model_init_dtype: float32

training:
  train_iters: 10
  train_samples: null
  eval_iters: 0
  global_batch_size: 8
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 8
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 8
  edp_shard_size: 1
  replicate_params: []
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: float32
    cast_forward_inputs: false
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

plan_overrides:
  # These replacements are optimizations only: the registered architecture is
  # executable before the Trainer applies any of them.
  - match:
      - "model.layers.*.attn_hc"
      - "model.layers.*.ffn_hc"
    module_type: hyper_parallel.models.deepseek_v41.modeling_deepseek_v41.DeepseekV41PipelinedHyperConnection
    replace_module:
      _target_: hyper_parallel.components.modules.mhc.PipelinedMhcModule
  - match: "model.layers.*.engram"
    module_type: hyper_parallel.models.deepseek_v41.modeling_deepseek_v41.DeepseekV41Engram
    replace_module:
      _target_: hyper_parallel.components.modules.engram.EngramModule
  # NOTE: the self_attn replace_module (SharedCompressedDSAAttention) and its
  # bound *.self_attn wrapper/attr entries are intentionally dropped on a
  # validation host without the omni kernel: the replacement's NPU
  # sparse-attention kernel needs the internal omni_training_custom_ops
  # package, and the CP wrapper type-checks for that replacement class. With
  # tp_size=1 and cp_size=1 those entries are inactive anyway; the native
  # DeepseekV41Attention carries the same semantics and the active parallel
  # axes on such a host are EP + FSDP only.
  - match: "model.layers.*.*_hc"
    region_dispatch: false
    params:
      fn: {tp: replicate}
      base: {tp: replicate}
      scale: {tp: replicate}
    in_src:
      hidden_streams: {tp: replicate, cp: "shard(1)", ep: replicate}
    in_dst:
      hidden_streams: {tp: replicate, cp: "shard(1)", ep: replicate}
    out_src:
      pre: {tp: replicate, cp: "shard(1)", ep: replicate}
      post: {tp: replicate, cp: "shard(1)", ep: replicate}
      residual: {tp: replicate, cp: "shard(1)", ep: replicate}
    out_dst:
      pre: {tp: replicate, cp: "shard(1)", ep: replicate}
      post: {tp: replicate, cp: "shard(1)", ep: replicate}
      residual: {tp: replicate, cp: "shard(1)", ep: replicate}
  - match: "model.layers.*.engram"
    params:
      q_weight: {tp: replicate}
      k_weight: {tp: replicate}
      embed.weight: {ep: "shard(0)"}
      wkv.weight: {tp: replicate}
  - match: "model.layers.*.engram"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: >-
        hyper_parallel.models.deepseek_v41.adapter.distributed.moe_engram_expert_parallel.deepseek_v41_engram_compute_fn
  - match: "*.mlp"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: >-
        hyper_parallel.models.deepseek_v41.adapter.distributed.moe_engram_expert_parallel.deepseek_v41_ep_compute_fn
      use_grouped_gemm: false

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: "off"
  selection:
    source: model_adapter_safe_regions
    layer_count: 0

activation_swap: none

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

dataset:
  model_assets:
    chat_template: null
    tokenizer:
      _target_: hyper_parallel.data.text.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: __DSV41_CONFIG__
      local_files_only: true
      use_fast: true
      trust_remote_code: false
  data_transform:
    _target_: hyper_parallel.data.text.text_transform.build_text_transform
    data_type: plaintext
    text_keys: text
    max_seq_len: 1024
    # A short trailing window breaks both the CSA compression-ratio alignment
    # and the context-parallel shard size once it lands in a batch.
    drop_ragged_tail: true
  _target_: hyper_parallel.data.text.build_dataset.build_online_text_mapping_dataset
  data_path: __VAL_ROOT__/data/online_1k.jsonl
  data_config:
    # Emit compact sample boundaries through the V4.1 runtime adapter. A dense
    # [S,S] mask would be infeasible at the report's 64K/1M training lengths.
    create_attention_mask_in_dataloader: true
    labels_are_shifted: true

dataloader:
  _target_: hyper_parallel.data.batching.TokenBatchLoader
  min_buffered_samples: 1
  collate_fn:
    _target_: hyper_parallel.data.batching.build_online_text_collate_fn
  get_batch:
    _target_: hyper_parallel.data.batching.TextParallelBatch
    source_type: online
    attention_mode: compressed
    runtime_input_adapter:
      _target_: hyper_parallel.models.deepseek_v41.adapter.data.runtime.DeepseekV41Runtime
      include_position_ids: false
      include_image_sequence_start: false
  sampler_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

optimizer:
  _target_: hyper_parallel.components.optim.Muon
  fp32_main_params: true
  no_decay_params: [bias, norm, ln_]
  muon_config:
    muon_lr: 3.0e-5
    muon_weight_decay: 0.0
    muon_momentum: 0.95
    muon_nesterov: true
    muon_ns_steps: 5
    muon_ns_variant: asym5
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 3.0e-5
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ""
  restore_from: null

debug:
  check_nan_inf: false
  check_dataset: null
