# Cropped Qwen3-30B-A3B from_config example with Offline Indexed Dataset input.

model:
  _target_: examples.training_demo.cropped_qwen3_moe.build_cropped_qwen3_moe
  config_path: /path/to/Qwen3-30B-A3B
  num_hidden_layers: 4
  local_files_only: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  # This YAML field directly controls HyperParallel placement validation.
  validate_placement: false

training:
  train_iters: 10
  train_samples: null
  eval_iters: 0
  global_batch_size: 8
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: true

accelerator:
  tp_size: 2
  cp_size: 2
  ep_size: 2
  pp_size: 1
  sequence_parallel: true
  loss_parallel: true

fsdp_config:
  dp_shard_size: 2
  edp_shard_size: 2
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

plan_overrides:
  - match:
      - "*.input_layernorm"
      - "*.post_attention_layernorm"
      - "model.norm"
    module_type: transformers.models.qwen3_moe.modeling_qwen3_moe.Qwen3MoeRMSNorm
    replace_module:
      _target_: hyper_parallel.auto_models.components.models.qwen3_moe_fusions.replace_qwen3_moe_rms_norm
  - match: "*.self_attn"
    module_type: transformers.models.qwen3_moe.modeling_qwen3_moe.Qwen3MoeAttention
    replace_module:
      _target_: hyper_parallel.auto_models.components.models.qwen3_moe_fusions.replace_qwen3_moe_flash_attention
  - match: "*.self_attn"
    when: cp
    region_dispatch: false
    inner_target: self
    inner_wrapper:
      _target_: hyper_parallel.auto_models.components.models.qwen3_moe_fusions.qwen3_moe_flash_attention_cp_wrapper
  - match: "*.mlp"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: hyper_parallel.auto_models.components.distributed.ep_compute.qwen3moe_ep_compute_fn
      use_grouped_gemm: true

mixed_precision:
  enabled: false

activation_checkpoint:
  mode: "off"

dataset:
  model_assets:
    chat_template: null
    tokenizer:
      _target_: hyper_parallel.auto_models.components.datasets.llm.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: /path/to/Qwen3-30B-A3B
      local_files_only: true
      tokenizer_type: pretokenized
      vocab_size: 151936
      eod_token_id: 151645

  _target_: hyper_parallel.auto_models.components.datasets.llm.build_indexed_text_dataset
  data_path: ./output/training_demo/data/parallel_offline_text_document
  data_config:
    seq_length: 128
    split: "1, 0, 0"
    mock_data: false
    distributed_walk: true
    is_dataset_from_mr: false
    simple_blend: "no"
    data_lazy_load: true
    skip_data_check: true
    # Indexed Dataset already returns text[1:] as the target.
    labels_are_shifted: true
    # The implicit-mask CP wrapper creates its own offset-aware causal mask.
    create_attention_mask_in_dataloader: false
    create_ltor_fields_in_dataloader: false

dataloader:
  _target_: hyper_parallel.auto_models.components.datasets.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.auto_models.components.datasets.build_indexed_collate_fn
  get_batch:
    _target_: hyper_parallel.auto_models.components.datasets.ParallelBatch
    source_type: indexed
    attention_mode: dense
    cp_algorithm: ulysses
  dataloader_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null

optimizer:
  _target_: hyper_parallel.auto_models.components.optim.optimizer.Muon
  no_decay_params: [bias, norm, ln_]
  muon_config:
    muon_lr: 3.0e-5
    muon_weight_decay: 0.0
    muon_momentum: 0.95
    muon_nesterov: true
    muon_ns_steps: 5
    muon_ns_variant: asym5
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.auto_models.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 3.0e-5
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ""
  restore_from: null

debug:
  check_nan_inf: false
  check_dataset: null
