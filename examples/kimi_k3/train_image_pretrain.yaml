# Explicit scratch pretraining; local configuration and processor assets are required.
model:
  _target_: hyper_parallel.models.kimi_k3.adapter.construction.build_kimi_k3_training_model
  config_path: /path/to/k3-training-config.json
  strip_inference_quantization: false
  torch_dtype: bfloat16
model_init_dtype: float32
loss_fn:
  _target_: hyper_parallel.models.kimi_k3.adapter.loss.KimiK3ChunkedCausalLMLoss
  chunk_size: 128
  ignore_index: -100
training:
  train_iters: 10
  eval_iters: 0
  global_batch_size: 1
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 1
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false
fsdp_config:
  dp_shard_size: 1
  edp_shard_size: 1
  mix_precision:
    param_dtype: bfloat16
    reduce_dtype: float32
    cast_forward_inputs: false
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
plan_overrides: []
mixed_precision:
  enabled: false
activation_checkpoint:
  mode: 'off'
activation_swap: none
compile:
  enabled: false
dataset:
  _target_: hyper_parallel.data.omni.build_online_omni_mapping_dataset
  data_path: /path/to/train.jsonl
  data_config: {}
  model_assets:
    _target_: hyper_parallel.data.omni.build_auto_processor
    pretrained_model_name_or_path: /path/to/local/Kimi-K3-processor
    local_files_only: true
    trust_remote_code: true
  data_transform:
    _target_: hyper_parallel.models.kimi_k3.adapter.data.transform_fn.build_kimi_k3_omni_transform
    max_seq_len: 2048
    label_policy: all_text
    pixel_dtype: float32
    patch_size: 14
    media_token_id: 163605
    media_begin_id: 163602
    media_end_id: 163604
  training_mode: pretrain
dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.models.kimi_k3.adapter.data.collate.build_kimi_k3_collate_fn
    pad_token_id: 163839
    pad_to_multiple_of: 2
    pre_shift_labels: false
    max_seq_len: 2048
  get_batch:
    _target_: hyper_parallel.data.batching.OmniParallelBatch
    prefetch_step_on_cpu: true
    runtime_input_adapter:
      _target_: hyper_parallel.models.kimi_k3.adapter.data.runtime.build_kimi_k3_runtime_input_adapter
  sampler_type: cyclic
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false
  prefetch_factor: null
optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  fp32_main_params: true
  no_decay_params:
  - bias
  - norm
  - ln_
  adamw_config:
    adamw_lr: 1.0e-05
    adamw_weight_decay: 0.1
    adamw_betas:
    - 0.9
    - 0.95
    adamw_eps: 1.0e-08
lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 1
    min_lr: 0.0
checkpoint:
  save_ckpt: false
  restore_from: null
  checkpoint_dir: ./output/kimi_k3/checkpoints
model_integration:
  mode: runtime
debug:
  check_nan_inf: true
  check_dataset: null
