# DeepSeek-V4-Pro complete architecture reference configuration.
#
# Architecture values mirror the local HF config.json. This file is intended
# for full-model planning and checkpoint loading; use train_tiny.yaml or
# train_real_2layer_16experts.yaml for a single-node 8-card smoke run.
model:
  name: deepseek_v4pro
  weights_path: /workspace/hyper-parallel/hfhub/models/deepseek-ai/DeepSeek-V4Pro
  tokenizer_path: /workspace/hyper-parallel/hfhub/models/deepseek-ai/DeepSeek-V4Pro
  config_overrides:
    architectures: [DeepseekV4ForCausalLM]
    model_type: deepseek_v4
    vocab_size: 129280
    hidden_size: 7168
    num_hidden_layers: 61
    num_attention_heads: 128
    num_key_value_heads: 1
    head_dim: 512
    q_lora_rank: 1536
    o_lora_rank: 1024
    o_groups: 16
    qk_rope_head_dim: 64
    rope_head_dim: 64
    sliding_window: 128
    window_size: 128
    n_routed_experts: 384
    num_experts: 384
    n_shared_experts: 1
    num_experts_per_tok: 6
    moe_intermediate_size: 3072
    scoring_func: sqrtsoftplus
    routed_scaling_factor: 2.5
    norm_topk_prob: true
    score_before_experts: false
    num_hash_layers: 3
    load_balance_coeff: 1.0e-3
    swiglu_limit: 10.0
    attention_bias: false
    attention_dropout: 0.0
    hidden_act: silu
    rms_norm_eps: 1.0e-6
    tie_word_embeddings: false
    max_position_embeddings: 1048576
    rope_theta: 10000.0
    compress_rope_theta: 160000.0
    rope_scaling_factor: 16.0
    original_seq_len: 65536
    beta_fast: 32
    beta_slow: 1
    hc_mult: 4
    hc_sinkhorn_iters: 20
    hc_eps: 1.0e-6
    index_n_heads: 64
    index_head_dim: 128
    index_topk: 1024
    compress_ratios:
      [128, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128,
       4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128,
       4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128,
       4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 0]
    num_nextn_predict_layers: 1
    num_mtp_modules: 0
    mtp_layer_compress_ratio: 1
    use_smla: false
    expert_dtype: fp4
    dtype: bfloat16
    torch_dtype: bfloat16
    use_cache: true

data:
  type: dummy
  # Keep the reference run cheap; increase this for a real training job.
  max_seq_len: 8
  num_workers: 0
  pin_memory: false
  shuffle: true

train:
  max_steps: 1
  num_train_epochs: 1
  global_batch_size: 8
  micro_batch_size: 1
  seed: 1234
  backend: torch
  init_device: meta

  accelerator:
    dp_shard: -1
    tp: 1
    cp: 1
    pp: 1
    ep: 1
    comm_fusion: true
    reshard_after_forward: true

  optimizer:
    type: adamw
    lr: 1.0e-4
    lr_min: 0.0
    lr_decay_style: cosine
    lr_warmup_ratio: 0.0
    max_grad_norm: 1.0e9
    weight_decay: 0.0
    loss_aggregation: token_weighted

  mixed_precision:
    enabled: true
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: bfloat16

  gradient_checkpointing:
    activation_checkpoint: full

  checkpoint:
    output_dir: outputs/deepseek_v4pro_full
    save_steps: 0
    save_hf_weights: false

  logging:
    log_steps: 1
    report_throughput: false

  debug:
    deterministic: true
