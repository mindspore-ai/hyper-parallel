# Qwen3-VL-MoE training template:
# visual Encoder DP/CP, save/resume, and 100-step alignment baseline.
model:
  name: qwen3_vl_moe
  weights_path: /path/to/Qwen3-VL-30B-A3B-Instruct
  tokenizer_path: /path/to/Qwen3-VL-30B-A3B-Instruct
  freeze_modules:
    - model.visual
  vision_parallel:
    dp_shard: 1
    cp: 2
    ulysses_degree: 1
    reuse_dp_shard_mesh: true
    share_samples_across_dp: true
  config_overrides:
    vl: true
    text_config:
      num_hidden_layers: 4

data:
  type: vl_dummy
  max_seq_len: 64
  vl_grid_t: 2
  vl_grid_h: 2
  vl_grid_w: 2

train:
  max_steps: 100
  num_train_epochs: 1
  global_batch_size: 4
  micro_batch_size: 1
  seed: 1234
  backend: torch
  init_device: meta

  accelerator:
    dp_shard: 4
    moe_token_dispatcher_type: all_to_all
    npu_nums_per_device: 8
    comm_fusion: true

  optimizer:
    type: adamw
    lr: 1.0e-4
    lr_min: 0.0
    lr_decay_style: cosine
    lr_warmup_ratio: 0.1
    max_grad_norm: 1.0e9
    weight_decay: 0.0
    loss_aggregation: rank_average

  mixed_precision:
    enabled: true
    param_dtype: bfloat16
    reduce_dtype: float32
    output_dtype: bfloat16

  gradient_checkpointing:
    activation_checkpoint: full

  checkpoint:
    output_dir: outputs/qwen3_vl_moe
    save_steps: 50
    load_path: null
    save_hf_weights: false
    save_async: false

  logging:
    log_steps: 1
    report_throughput: false

  debug:
    deterministic: true
