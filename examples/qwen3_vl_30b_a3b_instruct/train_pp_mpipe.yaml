# MPipe Transpose pipeline-parallel config for the FULL Qwen3-VL-30B-A3B
# (VL MoE) on 128 devices (8 A3 nodes x 16 dies): pp=8 x dp_shard=16.
# The frozen visual tower is the transposed block: each rank encodes its own
# micro-batch's images during the warmup bubble and ships the image_embeds +
# DeepStack features to stage 0, which injects them. Frozen tower = no
# parameter broadcast and no recompute — MPipe's best-fit case.
# Requires freeze_modules: model.visual. The text decoder's 48 layers split
# across 8 stages (6 each); activation checkpointing is ON with per-stage
# recompute depths, and the less-memory warmup caps in-flight activations on
# the early stages.
# Launch (128 ranks):
#   torchrun --nnodes=8 --nproc_per_node=16 scripts/train_vl.py \
#       examples/qwen3_vl_30b_a3b_instruct/train_pp_mpipe.yaml
model:
  name: qwen3_vl_moe
  weights_path: /path/to/Qwen3-VL-30B-A3B-Instruct
  tokenizer_path: /path/to/Qwen3-VL-30B-A3B-Instruct
  # Freeze the vision tower (standard Qwen-VL SFT recipe): autograd drops the
  # heavy ViT activations, and MPipe ships features only.
  freeze_modules:
    - model.visual
  config_overrides:
    vl: true   # required: routes to the VL builder (vision tower + pixel path)
    text_config:
      num_hidden_layers: 48   # the full 30B depth (toy default is 4)

data:
  # Synthetic VL batches — one 1536x1536 image (grid 1x96x96 -> 2304 vision
  # tokens) in an 8192-token sequence.
  type: vl_dummy
  # In-schedule dataload (DATA_LOAD/SEND/RECV): each PP rank's sampler yields
  # only its owned micros. MPipe-only knob.
  load: single
  max_seq_len: 8192
  vl_grid_t: 1
  vl_grid_h: 96
  vl_grid_w: 96

train:
  max_steps: 20
  num_train_epochs: 1
  # data.load single: gbs == pp_micro_batch_num * micro_batch_size * dp_shard
  # (no gradient accumulation).
  global_batch_size: 256
  micro_batch_size: 1
  seed: 1234
  backend: torch
  init_device: meta

  accelerator:
    # 2-D parallelism: 8 pipeline stages, each FSDP-sharded over 16 ranks.
    pp: 8
    pp_micro_batch_num: 16    # >= pp; 16 micros keep the pp=8 bubble at 7/23
    pp_schedule: mpipe
    # Transpose the whole (frozen) visual tower.
    pp_mpipe_transpose_layers: visual
    # 16 micros > 8 owners: distribute the overflow round-robin so every rank
    # encodes 2 ViT micros ("min" piles them on rank 0 instead).
    pp_mpipe_transpose_overflow: full
    # Shallow warmup: early stages hold up to pp-1 fewer in-flight activations.
    pp_less_memory: true
    dp_shard: 16              # explicit: 128 dies / pp 8 (fail loud on wrong world)
    reshard_after_forward: true
    comm_fusion: true
    # FSDP all-gather/compute overlap, depth 1. Under PP this reaches only the
    # visual tower blocks (pipeline stages keep their params gathered); the
    # frozen tower has no backward, so backward prefetch stays 0.
    fsdp_forward_prefetch: 1
    fsdp_backward_prefetch: 0

  optimizer:
    type: adamw
    lr: 1.0e-4
    lr_min: 0.0
    lr_decay_style: cosine
    lr_warmup_ratio: 0.1
    max_grad_norm: 1.0e9
    weight_decay: 0.0
    loss_aggregation: token_weighted   # PP rejects rank_average

  mixed_precision:
    enabled: true
    param_dtype: bfloat16
    reduce_dtype: bfloat16
    output_dtype: bfloat16

  gradient_checkpointing:
    activation_checkpoint: full
    # Per-global-stage recompute depth (of 6 layers each): recompute more where
    # more micro-batches are in flight (early stages), none on the last two.
    num_layers: [5, 4, 4, 3, 3, 1, 0, 0]

  checkpoint:
    output_dir: outputs/qwen3_vl_moe_pp_mpipe
    save_steps: 0
    save_hf_weights: false

  logging:
    log_steps: 1
    report_throughput: false
