# DeepSeek-V4.1 validation-crop recipe for the dry-run memory sync ST.
# @MODEL_PATH@/@ENGRAM_PATH@/@DATA_PATH@/@OUTPUT_ROOT@ are substituted by the
# launcher from HP_DRYRUN_ST_* environment variables (assets are local-only).

model:
  _target_: hyper_parallel.tools.dryrun.examples.deepseek_v41.build_text_model
  config_path: @MODEL_PATH@
  engram_assets_path: @ENGRAM_PATH@
  torch_dtype: bfloat16
  num_hidden_layers: 8
  text_parameter_divisor: 8
  num_routed_experts: 16
  loss_chunks: 8
  recompute_tier: none
  validate_placement: false
model_init_dtype: float32

training:
  train_iters: 3  # memory profiler dumps after step 2
  global_batch_size: 8
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 8
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 8
  edp_shard_size: 1
  mix_precision: {param_dtype: bfloat16, reduce_dtype: float32, cast_forward_inputs: false}
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 0
  backward_prefetch_depth: 0
  comm_fusion: false

plan_overrides:
  - match: "model.layers.*.engram"
    replace:
      kind: module
      implementation:
        _target_: hyper_parallel.components.modules.engram.EngramModule
  - match: "model.layers.*.self_attn"
    replace:
      kind: module
      implementation:
        _target_: >-
          hyper_parallel.components.modules.shared_compressed_dsa_attention.SharedCompressedDSAAttention
        use_fused_ops: false
  - match: "*.self_attn"
    tp_divide_attrs: [num_groups]
  - match: "*.self_attn.forward"
    replace:
      kind: method
      implementation:
        _target_: >-
          hyper_parallel.models.deepseek_v41.adapter.distributed.shared_attention_context_parallel.deepseek_v41_shared_attention_parallel_wrapper
  - match: "model.layers.*.*_hc"
    region_dispatch: false
    params:
      fn: {tp: replicate}
      base: {tp: replicate}
      scale: {tp: replicate}
    in_src:
      hidden_streams: {tp: replicate, cp: "shard(1)", ep: replicate}
    in_dst:
      hidden_streams: {tp: replicate, cp: "shard(1)", ep: replicate}
    out_src:
      pre: {tp: replicate, cp: "shard(1)", ep: replicate}
      post: {tp: replicate, cp: "shard(1)", ep: replicate}
      residual: {tp: replicate, cp: "shard(1)", ep: replicate}
    out_dst:
      pre: {tp: replicate, cp: "shard(1)", ep: replicate}
      post: {tp: replicate, cp: "shard(1)", ep: replicate}
      residual: {tp: replicate, cp: "shard(1)", ep: replicate}
  - match: "model.layers.*.*_hc"
    when: sequence_parallel
    in_src:
      hidden_streams: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
    in_dst:
      hidden_streams: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
    out_src:
      pre: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
      post: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
      residual: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
    out_dst:
      pre: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
      post: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
      residual: {tp: "shard(1)", cp: "shard(1)", ep: replicate}
  - match: "model.layers.*.engram"
    params:
      q_weight: {tp: replicate}
      k_weight: {tp: replicate}
      embed.weight: {ep: "shard(0)"}
      wkv.weight: {tp: replicate}
  - match: "model.layers.*.engram.forward"
    when: ep
    replace:
      kind: method
      implementation:
        _target_: >-
          hyper_parallel.models.deepseek_v41.adapter.distributed.moe_engram_expert_parallel.deepseek_v41_engram_compute_fn
  - match: "model.layers.*.mlp.forward"
    when: ep
    replace:
      kind: method
      implementation:
        _target_: >-
          hyper_parallel.models.deepseek_v41.adapter.distributed.moe_engram_expert_parallel.deepseek_v41_ep_compute_fn
        use_grouped_gemm: false
        fix_router: true

activation_checkpoint:
  mode: full

dataset:
  _target_: hyper_parallel.data.text.build_dataset.build_online_text_mapping_dataset
  data_path: @DATA_PATH@
  data_config: {create_attention_mask_in_dataloader: true, labels_are_shifted: true}
  model_assets:
    chat_template: null
    tokenizer:
      _target_: hyper_parallel.data.text.build_tokenizer.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: @MODEL_PATH@
      local_files_only: true
      use_fast: true
      trust_remote_code: false
  data_transform:
    _target_: hyper_parallel.data.text.text_transform.build_text_transform
    data_type: plaintext
    text_keys: text
    max_seq_len: 4096
    drop_ragged_tail: true

dataloader:
  _target_: hyper_parallel.data.batching.TokenBatchLoader
  min_buffered_samples: 1
  collate_fn:
    _target_: hyper_parallel.data.batching.build_online_text_collate_fn
    pad_to_length: 4096
  get_batch:
    _target_: hyper_parallel.data.batching.TextParallelBatch
    source_type: online
    attention_mode: compressed
    runtime_input_adapter:
      _target_: hyper_parallel.models.deepseek_v41.adapter.data.runtime.DeepseekV41Runtime
      include_position_ids: false
      include_image_sequence_start: false
  sampler_type: single
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 0
  pin_memory: false

optimizer:
  _target_: hyper_parallel.components.optim.Muon
  fp32_main_params: true
  no_decay_params: [bias, norm, ln_]
  muon_config: {muon_lr: 3.0e-05, muon_weight_decay: 0.0, muon_momentum: 0.95,
                muon_nesterov: true, muon_ns_steps: 5, muon_ns_variant: asym5}
  adamw_config: {adamw_lr: 1.0e-05, adamw_weight_decay: 0.01,
                 adamw_betas: [0.9, 0.999], adamw_eps: 1.0e-08}

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr: 3.0e-5
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint: {save_ckpt: false, checkpoint_dir: @OUTPUT_ROOT@/ckpt_unused}

# Real-run allocator snapshots; inert for dryrun.
memory:
  enable: true
  start_step: 1
  end_step: 1  # single-step window: counts compare 1:1 with the one-step simulation
  save_path: @OUTPUT_ROOT@/real_snapshots
  dump_ranks: [0]
  stacks: all

dry_run:
  enabled: true
  target_device: npu
  ranks: [0]
  virtual_world_size: 8
  snapshot:
    enabled: true
    path: @OUTPUT_ROOT@/dryrun_snapshots
    capture_stacks: true
    stack_depth: 64
