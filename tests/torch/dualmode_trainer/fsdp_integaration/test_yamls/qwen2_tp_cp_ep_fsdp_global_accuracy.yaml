# Transformers 5.x Qwen2-MoE TP+CP+EP+FSDP global-view accuracy configuration.
model:
  _target_: torch.nn.Identity

optimizer:
  _target_: torch.optim.SGD
  lr: 0.0001

lr_scheduler:
  _target_: hyper_parallel.auto_models.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: constant
  lr_config: {}

training:
  backend: hccl
  global_batch_size: 8
  micro_batch_size: 4
  seed: 31415

accelerator:
  tp_size: 2
  cp_size: 2
  ep_size: 2
  pp_size: 1
  sequence_parallel: true
  loss_parallel: false

plan_overrides:
  - match: "*.self_attn"
    when: cp
    region_dispatch: false
    inner_target: "self"
    inner_wrapper: sdpa_hf
  - match: "*.mlp"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: hyper_parallel.auto_models.components.distributed.ep_compute.qwen2moe_ep_compute_fn

fsdp_config:
  dp_shard_size: 2
  edp_shard_size: 1
  reshard_after_forward: true
  enable_fsdp2_prefetch: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  replicate_params:
    - model.norm.weight
