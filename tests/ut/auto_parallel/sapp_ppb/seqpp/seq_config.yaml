# PyTorch HyperParallel training config used by the seqpp solver test.
model:
  name: llama2_7b
  config_overrides:
    num_attention_heads: 32
    hidden_size: 4096
    num_hidden_layers: 16
    vocab_size: 32000
    max_position_embeddings: 8192

data:
  max_seq_len: 8192

train:
  micro_batch_size: 8
  micro_batch_num: 32
  accelerator:
    dp_replicate: 2
    tp_degree: 4
    pipeline_parallel_degree: 8
    context_parallel_degree: 1
    use_seq_parallel: true
