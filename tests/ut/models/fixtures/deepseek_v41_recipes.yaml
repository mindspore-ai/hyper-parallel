hyper_parallel/models/deepseek_v41/tools/nd_train_deepseek_v41_timing.yaml:
  accelerator:
    tp_size: 1
    cp_size: 1
    ep_size: 16
    pp_size: 1
    sequence_parallel: false
    loss_parallel: false
  plan_overrides:
  - match:
    - model.layers.*.attn_hc
    - model.layers.*.ffn_hc
    replace:
      kind: module
      implementation:
        _target_: hyper_parallel.components.modules.PipelinedMhc
  - match: model.layers.*.engram
    replace:
      kind: module
      implementation:
        _target_: hyper_parallel.components.modules.Engram
  - match: model.layers.*.self_attn
    replace:
      kind: module
      implementation:
        _target_: hyper_parallel.components.modules.CompressedSparseAttention2
  - match: '*.mlp.forward'
    when: ep
    region_dispatch: false
    replace:
