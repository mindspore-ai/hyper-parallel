name: 🐛 Bug report
description: Create a report to help us reproduce and fix the bug
title: "[Bug]: "
labels: ["bug"]
type: "Bug"
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: 1. I have searched the existing issues (https://gitcode.com/mindspore/hyper-parallel/issues)
        - label: 2. I have read the relevant documentation.
        - label: 3. I have created a minimal reproduction case that clearly demonstrates the issue, including a complete code example and the error message with full traceback and error logs.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 🐛 Describe the bug
      description: |
        A clear description of the issue. Include relevant environment details, reproduction steps, expected vs actual behavior, and any error messages.
      placeholder: |
        Description of the bug encountered.

        ```python
        # Sample code to reproduce the problem
        ```

        ```
        The error message you got, with the full traceback and the error logs.
        ```
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: Details about expected functionality.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Any other relevant information.
      placeholder: "Any other things you would like to mention."
  - type: textarea
    attributes:
      label: Environment info
      description: Relevant environment details.
    validations:
      required: true
  - type: markdown
    attributes:
      value: >
        Thanks for contributing 🎉!
